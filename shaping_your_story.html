<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaping Your Story - Revive Tutoring</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#eef4f0;color:#1a1a1a}
.hdr{background:#1a3a2a;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.hdr-t{font-size:18px;font-weight:800;color:#fff}
.hdr-s{font-size:11px;color:rgba(255,255,255,.6)}
.rst{padding:6px 14px;font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:8px;background:transparent;cursor:pointer;color:#fff}
.prg{background:#fff;padding:10px 20px;border-bottom:1px solid #d0e4d8;display:flex;align-items:center;gap:12px}
.prg-bg{flex:1;background:#d0e4d8;border-radius:999px;height:12px;overflow:hidden}
.prg-fill{height:100%;background:linear-gradient(90deg,#1a3a2a,#2d7a4f);border-radius:999px;transition:width .4s}
.prg-txt{font-size:12px;font-weight:700;color:#555;white-space:nowrap}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid #d0e4d8;padding:0 8px}
.tab{padding:10px 12px;font-size:11px;font-weight:700;border:none;background:transparent;cursor:pointer;color:#999;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:#1a3a2a;border-bottom-color:#2d7a4f}
.tab.dn{color:#2d7a4f}
.wrap{max-width:800px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;border:1px solid #d0e4d8;margin-bottom:16px;overflow:hidden}
.card-hd{background:#1a3a2a;padding:14px 20px}
.card-num{font-size:10px;font-weight:700;color:#7dcca0;letter-spacing:2px;margin-bottom:3px}
.card-ttl{font-size:18px;font-weight:800;color:#fff}
.card-bd{padding:20px}
.inst{background:#f0f7f3;border-left:4px solid #2d7a4f;padding:12px 16px;font-size:13px;line-height:1.7;color:#333;margin-bottom:14px;border-radius:0 8px 8px 0}
.note{background:#fff8e1;border:1px solid #f0c040;border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:#5a4708;margin-bottom:14px}
.ex-box{background:#f6fcf8;border:2px solid #a8d8b8;border-radius:10px;padding:16px;margin-bottom:14px}
.clue-lbl{background:#fff8e1;border:1px solid #f0c040;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;color:#5a4708;margin-bottom:10px}
.clue-lbl .lbl{font-size:10px;font-weight:700;color:#8b6914;letter-spacing:1px;margin-bottom:4px}
.card-txt{font-size:13.5px;line-height:1.6;color:#2a2a2a;margin-bottom:10px}
.q{margin-bottom:14px}
.q-lbl{font-size:13px;font-weight:700;color:#1a3a2a;margin-bottom:6px;line-height:1.5}
textarea{width:100%;border:2px solid #d0e4d8;border-radius:8px;padding:10px;font-size:13px;font-family:Arial,sans-serif;line-height:1.6;resize:vertical;min-height:90px;background:#fefefe}
textarea:focus{outline:none;border-color:#2d7a4f}
textarea.ok{border-color:#2d7a4f;background:#f6fcf8}
.btn{padding:10px 22px;font-size:13px;font-weight:700;border-radius:10px;cursor:pointer;font-family:Arial,sans-serif;border:none}
.btn-sub{background:#1a3a2a;color:#fff}
.btn-sub:disabled{background:#aaa;cursor:default}
.btn-nav{border:2px solid #1a3a2a;background:transparent;color:#1a3a2a}
.btn-nav.nxt{background:#1a3a2a;color:#fff}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;flex-wrap:wrap}
.done{display:none;background:#e1f5ee;border:2px solid #1d9e75;border-radius:10px;padding:10px 16px;font-size:13px;color:#0f6e56;font-weight:700;text-align:center;margin-top:10px}
.done.show{display:block}
.vs-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.vs-opt{border:2px solid #d0e4d8;border-radius:10px;padding:12px;cursor:pointer;font-size:13px;line-height:1.6;background:#fff}
.vs-opt:hover{border-color:#2d7a4f}
.vs-opt.cor{border-color:#1d9e75;background:#e1f5ee}
.vs-opt.wrg{border-color:#e24b4a;background:#fcebeb}
.vs-opt.rev{border-color:#1d9e75;background:#e1f5ee}
.vs-fb{font-size:12px;margin-top:6px;padding:8px 10px;border-radius:6px;display:none}
.vs-fb.show{display:block}
.vs-fb.cor{background:#e1f5ee;color:#0f6e56}
.vs-fb.wrg{background:#fcebeb;color:#a32d2d}
.lab-choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lab-btn{padding:6px 12px;border-radius:14px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;font-family:Arial,sans-serif}
.lab-res{font-size:12px;padding:8px 10px;border-radius:6px;margin-top:8px}
.lab-res.cor{background:#e1f5ee;color:#0f6e56}
.lab-res.wrg{background:#faeeda;color:#854f0b}
.odd-p{background:#fffdf7;border:2px solid #e8d8a0;border-radius:10px;padding:14px 16px;margin-bottom:12px;font-size:13.5px;line-height:2.1;color:#2a2a2a}
.odd-s{cursor:pointer;border-radius:4px;padding:1px 3px;border-bottom:2px dashed #bbb}
.odd-s:hover{background:#ffe08a}
.odd-s.bad{background:#fcebeb;border-bottom-color:#e24b4a;color:#a32d2d;text-decoration:line-through}
.odd-s.keep{background:#eef4f0;border-bottom-color:#9bbfaa}
.legend{background:#fefaf3;border:2px solid #e8d8a0;border-radius:10px;padding:12px 14px;margin-bottom:14px}
.legend h4{font-size:10px;font-weight:700;color:#8b6914;letter-spacing:2px;margin-bottom:8px}
.legend .row{display:flex;flex-wrap:wrap;gap:6px}
.legend span{color:#fff;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700}
.prz-ov{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
.prz-ov.show{display:flex}
.prz-bx{background:#fff;border-radius:20px;padding:28px;max-width:460px;width:92%;text-align:center}
.prz-icon{font-size:48px;margin-bottom:8px}
.prz-ttl{font-size:22px;font-weight:800;color:#1a3a2a;margin-bottom:6px}
.prz-sub{font-size:14px;color:#666;margin-bottom:16px}
.prz-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.prz-tab{padding:7px 16px;font-size:12px;font-weight:700;border:2px solid #d0e4d8;border-radius:18px;background:#fff;cursor:pointer;font-family:Arial,sans-serif}
.prz-tab.on{border-color:#1a3a2a;background:#e8f4ec;color:#1a3a2a}
.vid-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.vid-a{background:#eef4f0;border-radius:8px;padding:10px 8px;text-decoration:none;color:#1a3a2a;font-size:11px;font-weight:700;border:1px solid #a8d8b8;display:block;line-height:1.5}
.vid-icon{font-size:18px;margin-bottom:3px}
.kg-btn{padding:10px 28px;font-size:14px;font-weight:800;border:none;border-radius:10px;background:#1a3a2a;cursor:pointer;color:#fff;font-family:Arial,sans-serif}
@media(max-width:600px){.vs-pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="hdr-t">Shaping Your Story</div><div class="hdr-s">Revive Tutoring</div></div>
  <div style="display:flex;gap:8px">
    <button class="rst" id="vid-btn">Brain Break</button>
    <button class="rst" id="rst-btn">Reset</button>
  </div>
</div>
<div class="prg">
  <div class="prg-bg"><div class="prg-fill" id="pf" style="width:0%"></div></div>
  <div class="prg-txt" id="pt">0 / 7</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap" id="main"></div>
<div class="prz-ov" id="pm">
  <div class="prz-bx">
    <div class="prz-icon" id="pi">&#x1F4D3;</div>
    <div class="prz-ttl">You earned a brain break!</div>
    <div class="prz-sub">Pick a category.</div>
    <div class="prz-tabs" id="prz-tabs-row"></div>
    <div class="vid-grid" id="vg"></div>
    <button class="kg-btn" id="kg-btn">Back to Writing</button>
  </div>
</div>
<script>
window.onerror = function(msg, src, line, col, err) {
  var d = document.createElement('div');
  d.style.cssText = 'background:red;color:white;padding:20px;font-size:16px;position:fixed;top:0;left:0;right:0;z-index:9999;';
  d.textContent = 'JS ERROR: ' + msg + ' (line ' + line + ')';
  document.body.appendChild(d);
  return false;
};
var N=7, done=[], score=0, cur=0, pvt='r', correct=0, lastVid=0;
for(var i=0;i<N;i++) done.push(false);

var VIDS={
  r:[{t:'Can you solve the bridge riddle?',u:'https://www.youtube.com/watch?v=7yDmGnA8Hw0'},{t:"Can you solve Einstein's riddle?",u:'https://www.youtube.com/watch?v=1rDVz_Fb6HQ'},{t:'Can you solve the prisoner hat riddle?',u:'https://www.youtube.com/watch?v=N5vJSNXPEwA'}],
  i:[{t:'How optical illusions trick your brain',u:'https://www.youtube.com/watch?v=rfdJyDfIHIc'},{t:'The McGurk Effect (an audio illusion)',u:'https://www.youtube.com/watch?v=jtsfidRq2tw'},{t:'The moon illusion',u:'https://www.youtube.com/watch?v=RXkYjL_7jME'}],
  s:[{t:"Turbulence: physics' great unsolved mystery",u:'https://www.youtube.com/watch?v=S3i6tJ4XNqA'},{t:"What would happen if you didn't sleep?",u:'https://www.youtube.com/watch?v=dqONk48l5vY'},{t:'Why do we dream?',u:'https://www.youtube.com/watch?v=2W85Dwxx218'}]
};

function sv(k,v){try{localStorage.setItem('shp_'+k,v);}catch(e){}}
function ld(k){try{return localStorage.getItem('shp_'+k)||'';}catch(e){return '';}}
function clr(){try{for(var k in localStorage){if(k.indexOf('shp_')===0)localStorage.removeItem(k);}}catch(e){}}
function el(id){return document.getElementById(id);}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e;}
function restTA(){
  setTimeout(function(){
    var ts=document.querySelectorAll('textarea[id]');
    for(var i=0;i<ts.length;i++){
      var s=ld(ts[i].id);
      if(s&&!ts[i].disabled){ts[i].value=s;if(s.trim().length>10)ts[i].classList.add('ok');}
    }
  },120);
}
function mark(i){
  if(done[i])return;
  done[i]=true;score++;
  el('pf').style.width=Math.round(score/N*100)+'%';
  el('pt').textContent=score+' / '+N;
  buildTabs();
}
function addCorrect(){
  correct++;
  var v=Math.floor(correct/5);
  if(v>lastVid){lastVid=v;setTimeout(showP,400);}
}
function setPT(t){pvt=t;showVids();}
function showVids(){
  var vg=el('vg');if(!vg)return;
  var pool=VIDS[pvt],pick=pool.slice().sort(function(){return Math.random()-.5;}).slice(0,4);
  vg.innerHTML='';
  pick.forEach(function(v){
    var a=ce('a','vid-a');a.href=v.u;a.target='_blank';
    var icon=ce('div','vid-icon');icon.textContent='▶';a.appendChild(icon);
    a.appendChild(document.createTextNode(v.t));
    vg.appendChild(a);
  });
}
function showP(){
  pvt='r';
  el('prz-tabs-row').querySelectorAll('.prz-tab').forEach(function(t,i){t.classList.toggle('on',i===0);});
  el('pi').textContent='📓';
  showVids();
  el('pm').classList.add('show');
}

var TLBL=['Plot Mountain','Stretch?','Stay on Topic','Transitions','Map It','Quick Draft','Stretch Heart'];
function buildTabs(){
  var w=el('tabs');w.innerHTML='';
  for(var i=0;i<N;i++){
    var b=ce('button','tab'+(i===cur?' on':'')+(done[i]?' dn':''));
    b.textContent=(done[i]?'+ ':'')+TLBL[i];
    b.setAttribute('data-i',String(i));
    b.addEventListener('click',function(){cur=parseInt(this.getAttribute('data-i'));render();});
    w.appendChild(b);
  }
}

// ===== ACT 0: PLOT MOUNTAIN (label cards) =====
var STAGES=['exposition','rising action','climax','falling action','resolution'];
var STAGE_COLORS={'exposition':'#185fa5','rising action':'#854f0b','climax':'#a32d2d','falling action':'#6b4fa3','resolution':'#2d7a4f'};
var LABEL=[
  {t:'The hot August morning, the drive into Santa Ana, and arriving at the nearly empty warehouse.',l:'exposition',w:'This sets the scene: the narrator, the place, and the situation before any trouble. That is exposition.'},
  {t:'A salesperson trails them every fifteen minutes, and strangers begin giving them unfriendly looks.',l:'rising action',w:'The tension builds as small, uneasy moments pile up. That is rising action.'},
  {t:'At the loading dock, family after family is served first while the two of them wait, until the mother finally pushes back.',l:'climax',w:'This is the turning point the whole story builds toward, the moment of highest tension. That is the climax.'},
  {t:'The workers finally load the appliances, and the two of them leave the warehouse.',l:'falling action',w:'The pressure eases and the scene winds down right after the peak. That is falling action.'},
  {t:'In the truck, the mother explains what happened, and the narrator reflects on her first encounter with racism.',l:'resolution',w:'The story settles into what is different now: the narrator understands something she did not before. That is the resolution.'}
];
var labAns={};
function labPick(i,choice,box){
  if(labAns[i])return;labAns[i]=true;
  var item=LABEL[i],ok=choice===item.l;
  if(ok)addCorrect();
  box.querySelectorAll('.lab-btn').forEach(function(b){ b.disabled=true; if(b.getAttribute('data-c')===item.l){ b.style.background=STAGE_COLORS[item.l]; b.style.color='#fff'; } });
  var res=ce('div','lab-res '+(ok?'cor':'wrg'));res.innerHTML=(ok?'Correct. ':'Not quite. ')+'<strong>'+item.l+'</strong>: '+item.w;box.appendChild(res);
  var all=true;for(var k=0;k<LABEL.length;k++){if(!labAns[k])all=false;}
  if(all){var d=el('lab_done');if(d)d.classList.add('show');mark(0);}
}
function renderPlot(){
  var wrap=ce('div');
  wrap.appendChild(ce('div','inst')).textContent='Every story climbs a plot mountain. It sets the scene (exposition), builds tension (rising action), reaches a turning point (climax), eases off (falling action), and settles into a new normal (resolution). Read each section below and choose where it sits on the mountain.';
  wrap.appendChild(ce('div','note')).textContent='Keep your printed copy of "The Racist Warehouse" next to you. Each card describes a section of that story.';
  var legend=ce('div','legend');
  legend.appendChild(ce('h4',null,'THE PLOT MOUNTAIN'));
  var row=ce('div','row');
  STAGES.forEach(function(s){var sp=ce('span');sp.style.background=STAGE_COLORS[s];sp.textContent=s;row.appendChild(sp);});
  legend.appendChild(row);wrap.appendChild(legend);
  LABEL.forEach(function(item,i){
    var box=ce('div','ex-box');
    box.appendChild(ce('div','card-txt')).textContent=item.t;
    var choices=ce('div','lab-choices');
    STAGES.forEach(function(s){
      var col=STAGE_COLORS[s];
      var btn=ce('button','lab-btn');btn.style.cssText='background:'+col+'22;color:'+col+';border-color:'+col+';';btn.textContent=s;btn.setAttribute('data-c',s);
      btn.addEventListener('click',function(){labPick(i,s,box);});
      choices.appendChild(btn);
    });
    box.appendChild(choices);
    wrap.appendChild(box);
  });
  var dn=ce('div','done'+(done[0]?' show':''));dn.id='lab_done';dn.textContent='You mapped the whole arc of the story.';wrap.appendChild(dn);
  return wrap;
}

// ===== PICKERS (idx 1 Stretch/Summarize, idx 3 Transitions) =====
var PICK={
  1:[
    {clue:'The two hours spent checking dryers and refrigerators for scratches.',a:'Stretch it (slow down)',b:'Summarize it (move fast)',c:'b',f:'This is background. It matters that it took a long time, but the details are not the point, so move through it quickly.'},
    {clue:'The long wait at the loading dock while family after family is served first.',a:'Stretch it (slow down)',b:'Summarize it (move fast)',c:'a',f:'This is the heart of the story, where the unfair treatment becomes clear. Slow down and let the reader feel every minute.'},
    {clue:'The moment the narrator notices the looks, checks the mirror, and realizes what is happening.',a:'Stretch it (slow down)',b:'Summarize it (move fast)',c:'a',f:'This is the turning point. Stretching it builds tension and lets the realization land.'},
    {clue:'The drive from home to the warehouse, before anything happens.',a:'Stretch it (slow down)',b:'Summarize it (move fast)',c:'b',f:'This is setup. A quick summary carries the reader to the real story without dragging.'}
  ],
  3:[
    {clue:'Needs a CONTRAST signal: I was sure I would love sleepaway camp. ____ by the second night, I was counting the hours until I could go home.',a:'As a result,',b:'However,',c:'b',f:'The second sentence reverses the first, so it needs a contrast word like however.'},
    {clue:'Needs a CAUSE-AND-EFFECT signal: Rain had soaked the field all morning. ____ the game was moved into the gym.',a:'As a result,',b:'Meanwhile,',c:'a',f:'The rain caused the change, so a cause-and-effect signal like as a result fits.'},
    {clue:'Needs a TIME-ORDER signal: We pitched the tent and built a fire. ____ we roasted marshmallows under the stars.',a:'In contrast,',b:'Afterward,',c:'b',f:'The events happen in order, so a time-order word like afterward fits.'},
    {clue:'Needs an OPENING-TIME signal: ____ I could barely look over the edge. A moment later, I leaned in.',a:'At first,',b:'Eventually,',c:'a',f:'This is the start of the sequence, so at first sets the beginning. Eventually would jump to the end.'}
  ]
};
var pickAns={1:{},3:{}}, pickCount={1:0,3:0};
function pickClick(act,pi,ch){
  if(pickAns[act][pi])return;pickAns[act][pi]=true;pickCount[act]++;
  var p=PICK[act][pi],ok=ch===p.c;
  var ae=el('p'+act+'a'+pi),be=el('p'+act+'b'+pi),fb=el('p'+act+'f'+pi);
  var cor=p.c==='a'?ae:be,wrg=p.c==='a'?be:ae;
  if(ok){cor.classList.add('cor');wrg.style.opacity='.5';fb.textContent='Yes. '+p.f;fb.className='vs-fb show cor';addCorrect();}
  else{wrg.classList.add('wrg');cor.classList.add('rev');fb.textContent='Look again. '+p.f;fb.className='vs-fb show wrg';}
  if(pickCount[act]>=PICK[act].length){var d=el('pk'+act+'_done');if(d)d.classList.add('show');mark(act);}
}
function renderPick(act,instTxt,doneTxt){
  var wrap=ce('div');
  wrap.appendChild(ce('div','inst')).textContent=instTxt;
  PICK[act].forEach(function(p,i){
    var box=ce('div','ex-box');
    var cl=ce('div','clue-lbl');
    var cll=ce('div','lbl');cll.textContent=act===1?'THE PART':'THE SENTENCES';cl.appendChild(cll);
    cl.appendChild(document.createTextNode(p.clue));box.appendChild(cl);
    var pair=ce('div','vs-pair');
    var oa=ce('div','vs-opt');oa.id='p'+act+'a'+i;oa.textContent=p.a;oa.addEventListener('click',function(){pickClick(act,i,'a');});
    var ob=ce('div','vs-opt');ob.id='p'+act+'b'+i;ob.textContent=p.b;ob.addEventListener('click',function(){pickClick(act,i,'b');});
    pair.appendChild(oa);pair.appendChild(ob);box.appendChild(pair);
    var fb=ce('div','vs-fb');fb.id='p'+act+'f'+i;box.appendChild(fb);
    wrap.appendChild(box);
  });
  var dn=ce('div','done'+(done[act]?' show':''));dn.id='pk'+act+'_done';dn.textContent=doneTxt;wrap.appendChild(dn);
  return wrap;
}

// ===== ACT 2: STAY ON TOPIC (click the odd sentence) =====
var ODD=[
  {sents:[
    {t:'Marcus gripped the edge of the diving board and stared at the water far below.'},
    {t:'His heart pounded as the swim coach raised the whistle.'},
    {t:'He had signed up for the team back in September.',bad:true},
    {t:'The pool went silent, and every kid on the bleachers turned to watch.'},
    {t:'He took one slow breath, bent his knees, and pushed off into the air.'}
  ]},
  {sents:[
    {t:'The wind slammed against the windows as the lights flickered once and died.'},
    {t:'Mom lit two candles and set them on the kitchen table.'},
    {t:'Our house was built in 1998.',bad:true},
    {t:'We pulled blankets off the couch and huddled together in the orange glow.'},
    {t:'For the first time all week, nobody reached for a phone.'}
  ]},
  {sents:[
    {t:'We had searched the whole neighborhood for almost two hours.'},
    {t:'My sister kept calling Biscuit\u2019s name until her voice went hoarse.'},
    {t:'Biscuit is a golden retriever.',bad:true},
    {t:'Just as the sky turned pink, I heard a familiar jingle of tags behind a fence.'},
    {t:'I dropped to my knees, and a muddy ball of fur barreled straight into my arms.'}
  ]}
];
var oddFound={};
function clickOdd(pi,si,span,box){
  if(oddFound[pi])return;
  var s=ODD[pi].sents[si];
  var fb=el('odd_fb'+pi);
  if(s.bad){
    span.classList.add('bad');oddFound[pi]=true;addCorrect();
    if(fb){fb.textContent='Yes. That sentence pulls away from the moment. Crossing it out keeps the paragraph focused.';fb.style.color='#0f6e56';}
    var all=true;for(var k=0;k<ODD.length;k++){if(!oddFound[k])all=false;}
    if(all){var d=el('odd_done');if(d)d.classList.add('show');mark(2);}
  } else {
    span.classList.add('keep');
    if(fb){fb.textContent='That sentence belongs. It keeps the reader inside the moment. Look for the one that wanders off topic.';fb.style.color='#777';}
    setTimeout(function(){span.classList.remove('keep');},900);
  }
}
function renderOdd(){
  var wrap=ce('div');
  wrap.appendChild(ce('div','inst')).textContent='Irrelevant details pull the reader away from the moment. Each paragraph below has one sentence that does not belong. Click the sentence that wanders off topic.';
  ODD.forEach(function(par,pi){
    var box=ce('div','odd-p');
    par.sents.forEach(function(s,si){
      var sp=ce('span','odd-s');sp.textContent=s.t;
      sp.addEventListener('click',function(){clickOdd(pi,si,this,box);});
      box.appendChild(sp);box.appendChild(document.createTextNode(' '));
    });
    var fb=ce('div');fb.id='odd_fb'+pi;fb.style.cssText='font-size:12px;margin-top:8px;min-height:14px;';box.appendChild(fb);
    wrap.appendChild(box);
  });
  var dn=ce('div','done'+(done[2]?' show':''));dn.id='odd_done';dn.textContent='You can spot the detail that does not belong.';wrap.appendChild(dn);
  return wrap;
}

// ===== WRITING EXERCISES (idx 4,5,6) =====
function makeQ(lbl,ta){var q=ce('div','q');var ql=ce('div','q-lbl');ql.textContent=lbl;q.appendChild(ql);q.appendChild(ta);return q;}
function makeWrEx(exIdx,mapIdx,qs,intro){
  var wrap=ce('div');
  wrap.appendChild(ce('div','inst')).textContent=intro;
  qs.forEach(function(q,i){
    var ta=ce('textarea');ta.id='wr'+exIdx+'_'+i;ta.placeholder='Write here...';if(q.tall)ta.style.minHeight='140px';
    var saved=ld(ta.id);if(saved){ta.value=saved;if(saved.trim().length>10)ta.classList.add('ok');}
    ta.addEventListener('input',function(){sv(this.id,this.value);if(this.value.trim().length>10)this.classList.add('ok');chkWrEx(exIdx,mapIdx);});
    wrap.appendChild(makeQ(q.t,ta));
  });
  var dn=ce('div','done'+(done[mapIdx]?' show':''));dn.id='wd'+exIdx;dn.textContent='Activity complete.';wrap.appendChild(dn);
  var navrow=ce('div','nav-row');
  var back=ce('button','btn btn-nav');back.textContent='Back';back.addEventListener('click',function(){cur=mapIdx-1;render();});
  if(mapIdx===0)back.style.visibility='hidden';
  var sub=ce('button','btn btn-sub');sub.id='wsub'+exIdx;sub.disabled=true;sub.textContent=done[mapIdx]?'Done':'Mark Complete';
  sub.addEventListener('click',function(){subWrEx(exIdx,mapIdx);});
  var nxt=ce('button','btn btn-nav nxt');nxt.textContent='Next';nxt.addEventListener('click',function(){cur=mapIdx+1;render();});
  if(mapIdx===N-1)nxt.style.visibility='hidden';
  navrow.appendChild(back);navrow.appendChild(sub);navrow.appendChild(nxt);
  wrap.appendChild(navrow);
  setTimeout(function(){chkWrEx(exIdx,mapIdx);},50);
  return wrap;
}
function chkWrEx(exIdx,mapIdx){
  var ts=document.querySelectorAll('[id^="wr'+exIdx+'_"]');
  var ok=true;ts.forEach(function(ta){if(ta.value.trim().length<10)ok=false;});
  var btn=el('wsub'+exIdx);if(btn)btn.disabled=!ok;
}
function subWrEx(exIdx,mapIdx){if(done[mapIdx])return;var d=el('wd'+exIdx);if(d)d.classList.add('show');mark(mapIdx);if(mapIdx<N-1)setTimeout(function(){cur=mapIdx+1;render();},700);}

// ===== MAIN RENDER =====
var EX_INFO=[
  {num:'Part 1',type:'The Plot Mountain',title:'Map the shape of the story'},
  {num:'Part 2',type:'Stretch or Summarize',title:'Slow the heart, speed past the rest'},
  {num:'Part 3',type:'Stay on Topic',title:'Cut the detail that does not belong'},
  {num:'Part 4',type:'Connect with Transitions',title:'Signal time, contrast, and cause'},
  {num:'Ex 1',type:'Map Your Story',title:'Plan your own plot mountain'},
  {num:'Ex 2',type:'Quick Draft',title:'Get the whole arc down fast'},
  {num:'Ex 3',type:'Stretch the Heart',title:'Shape the pacing'}
];
var WRITE_ACTS=[4,5,6];
function render(){
  buildTabs();
  var ex=EX_INFO[cur];
  var card=ce('div','card');
  var hd=ce('div','card-hd');
  hd.appendChild(ce('div','card-num')).textContent=ex.num+' - '+ex.type;
  hd.appendChild(ce('div','card-ttl')).textContent=ex.title;
  card.appendChild(hd);
  var bd=ce('div','card-bd');
  var content;
  if(cur===0)content=renderPlot();
  else if(cur===1)content=renderPick(1,'Good writers stretch the heart of the story and summarize the background. Stretching means slowing down and adding detail. Summarizing means moving through quickly. For each part of "The Racist Warehouse," choose what the writer should do.','You know which moments to stretch and which to summarize.');
  else if(cur===2)content=renderOdd();
  else if(cur===3)content=renderPick(3,'Transitions connect sentences and signal a job: time order, contrast, or cause and effect. Read each pair and choose the transition that fits the job named in the hint.','You can pick the transition that fits the job.');
  else if(cur===4)content=makeWrEx(4,4,[
    {t:'Exposition: Who is in your story, where does it happen, and what is going on before the problem starts?',tall:true},
    {t:'Rising action: What happens that builds toward the big moment? List two or three steps.',tall:true},
    {t:'Climax: What is the single most important moment, the turning point?'},
    {t:'Falling action and resolution: What happens right after, and what is different by the end?',tall:true}
  ],'Plan your own true story on the plot mountain before you draft. Use the moment you sketched in the Personal Narrative lesson, or pick a new one.');
  else if(cur===5)content=makeWrEx(5,5,[
    {t:'Write your quick draft. Tell the whole story from beginning to end in one paragraph. Do not stop to make it perfect.',tall:true}
  ],'Now get the whole story down fast and rough, start to finish. You are building something to shape later, not writing the final version.');
  else if(cur===6)content=makeWrEx(6,6,[
    {t:'Find the climax of your story. Rewrite that moment slowly, across several sentences, adding what you saw, heard, and felt.',tall:true},
    {t:'Name one part of your story that is only background, then write a single sentence that summarizes it.'}
  ],'Your quick draft treats every part the same. Now shape it. Stretch the heart of your story, and summarize a part that is only background.');
  if(WRITE_ACTS.indexOf(cur)===-1){
    var navrow=ce('div','nav-row');
    if(cur>0){var back=ce('button','btn btn-nav');back.textContent='Back';back.addEventListener('click',function(){cur--;render();});navrow.appendChild(back);}else{navrow.appendChild(ce('div'));}
    navrow.appendChild(ce('div'));
    if(cur<N-1){var nxt=ce('button','btn btn-nav nxt');nxt.textContent='Next';nxt.addEventListener('click',function(){cur++;render();});navrow.appendChild(nxt);}else{navrow.appendChild(ce('div'));}
    content.appendChild(navrow);
  }
  bd.appendChild(content);card.appendChild(bd);
  el('main').innerHTML='';el('main').appendChild(card);
  restTA();
  window.scrollTo({top:0,behavior:'smooth'});
}
function resetAll(){
  clr();
  done=[];for(var i=0;i<N;i++)done.push(false);
  score=0;cur=0;correct=0;lastVid=0;
  labAns={};
  pickAns={1:{},3:{}};pickCount={1:0,3:0};
  oddFound={};
  el('pf').style.width='0%';el('pt').textContent='0 / '+N;
  render();
}

el('rst-btn').addEventListener('click',resetAll);
el('vid-btn').addEventListener('click',showP);
el('kg-btn').addEventListener('click',function(){el('pm').classList.remove('show');});

var ptab_data=[{t:'Riddles',k:'r'},{t:'Illusions',k:'i'},{t:'Weird Science',k:'s'}];
ptab_data.forEach(function(p,i){
  var b=ce('button','prz-tab'+(i===0?' on':''));b.textContent=p.t;
  b.addEventListener('click',function(){
    el('prz-tabs-row').querySelectorAll('.prz-tab').forEach(function(t){t.classList.remove('on');});
    this.classList.add('on');setPT(p.k);
  });
  el('prz-tabs-row').appendChild(b);
});

render();
</script>
