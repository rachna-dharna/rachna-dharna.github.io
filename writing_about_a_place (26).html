<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing About a Place - Revive Tutoring</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#eef4f0;color:#1a1a1a}
.hdr{background:#1a3a2a;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.hdr-t{font-size:18px;font-weight:800;color:#fff}
.hdr-s{font-size:11px;color:rgba(255,255,255,.6)}
.rst{padding:6px 14px;font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:8px;background:transparent;cursor:pointer;color:#fff}
.prg{background:#fff;padding:10px 20px;border-bottom:1px solid #d0e4d8;display:flex;align-items:center;gap:12px}
.prg-bg{flex:1;background:#d0e4d8;border-radius:999px;height:12px;overflow:hidden}
.prg-fill{height:100%;background:linear-gradient(90deg,#1a3a2a,#2d7a4f);border-radius:999px;transition:width .4s}
.prg-txt{font-size:12px;font-weight:700;color:#555;white-space:nowrap}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid #d0e4d8;padding:0 8px}
.tab{padding:10px 12px;font-size:11px;font-weight:700;border:none;background:transparent;cursor:pointer;color:#999;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:#1a3a2a;border-bottom-color:#2d7a4f}
.tab.dn{color:#2d7a4f}
.wrap{max-width:800px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;border:1px solid #d0e4d8;margin-bottom:16px;overflow:hidden}
.card-hd{background:#1a3a2a;padding:14px 20px}
.card-num{font-size:10px;font-weight:700;color:#7dcca0;letter-spacing:2px;margin-bottom:3px}
.card-ttl{font-size:18px;font-weight:800;color:#fff}
.card-bd{padding:20px}
.inst{background:#f0f7f3;border-left:4px solid #2d7a4f;padding:12px 16px;font-size:13px;line-height:1.7;color:#333;margin-bottom:14px;border-radius:0 8px 8px 0}
.banned{background:#fcebeb;border-radius:8px;padding:10px 14px;font-size:13px;color:#a32d2d;margin-bottom:14px;line-height:1.6}
.ex-box{background:#f6fcf8;border:2px solid #a8d8b8;border-radius:10px;padding:16px;margin-bottom:14px}
.ex-ttl{font-size:14px;font-weight:800;color:#1a3a2a;margin-bottom:10px}
.ex-lbl{background:#f0f7ff;border-radius:8px;padding:12px;font-size:13px;line-height:1.7;color:#333;margin-bottom:12px;border:1px solid #c8d8f0}
.ex-lbl .lbl{font-size:10px;font-weight:700;color:#185fa5;letter-spacing:1px;margin-bottom:4px}
.q{margin-bottom:14px}
.q-lbl{font-size:13px;font-weight:700;color:#1a3a2a;margin-bottom:6px;line-height:1.5}
textarea{width:100%;border:2px solid #d0e4d8;border-radius:8px;padding:10px;font-size:13px;font-family:Arial,sans-serif;line-height:1.6;resize:vertical;min-height:90px;background:#fefefe}
textarea:focus{outline:none;border-color:#2d7a4f}
textarea.ok{border-color:#2d7a4f;background:#f6fcf8}
textarea:disabled{background:#f5f5f5;cursor:not-allowed}
.btn{padding:10px 22px;font-size:13px;font-weight:700;border-radius:10px;cursor:pointer;font-family:Arial,sans-serif;border:none}
.btn-sub{background:#1a3a2a;color:#fff}
.btn-sub:disabled{background:#aaa;cursor:default}
.btn-nav{border:2px solid #1a3a2a;background:transparent;color:#1a3a2a}
.btn-nav.nxt{background:#1a3a2a;color:#fff}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;flex-wrap:wrap}
.done{display:none;background:#e1f5ee;border:2px solid #1d9e75;border-radius:10px;padding:10px 16px;font-size:13px;color:#0f6e56;font-weight:700;text-align:center;margin-top:10px}
.done.show{display:block}
.vs-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.vs-opt{border:2px solid #d0e4d8;border-radius:10px;padding:12px;cursor:pointer;font-size:13px;line-height:1.6;background:#fff}
.vs-opt:hover{border-color:#2d7a4f}
.vs-opt.cor{border-color:#1d9e75;background:#e1f5ee}
.vs-opt.wrg{border-color:#e24b4a;background:#fcebeb}
.vs-opt.rev{border-color:#1d9e75;background:#e1f5ee}
.vs-fb{font-size:12px;margin-top:6px;padding:8px 10px;border-radius:6px;display:none}
.vs-fb.show{display:block}
.vs-fb.cor{background:#e1f5ee;color:#0f6e56}
.vs-fb.wrg{background:#fcebeb;color:#a32d2d}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.sw-word{padding:7px 13px;border-radius:20px;font-size:13px;font-weight:700;border:2px solid #d0e4d8;background:#fff;cursor:pointer;user-select:none}
.sw-word.placed{opacity:.4;cursor:default}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.bin{border:2px dashed #aaa;border-radius:10px;padding:10px;min-height:80px;cursor:pointer}
.bin-ttl{font-size:12px;font-weight:700;color:#555;margin-bottom:6px;text-align:center}
.bin-words{display:flex;flex-wrap:wrap;gap:6px;min-height:36px}
.placed-tag{padding:5px 10px;border-radius:14px;font-size:12px;font-weight:700;color:#fff}
.cl-para{font-size:14px;line-height:2.2;color:#333;margin-bottom:12px}
.cl-w{cursor:pointer;background:#fff;border-radius:4px;padding:1px 4px;border-bottom:2px dashed #aaa}
.cl-w:hover{background:#ffe08a}
.cl-w.fnd{background:#fcebeb;border-bottom-color:#e24b4a;text-decoration:line-through;color:#a32d2d}
.bld-slots{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;min-height:44px;align-items:center}
.bld-slot{border:2px dashed #aaa;border-radius:8px;padding:7px 12px;min-width:70px;font-size:13px;color:#888;text-align:center;cursor:pointer}
.bld-slot.filled{border-color:#2d7a4f;color:#1a3a2a;font-weight:700;background:#f0f7f3}
.bld-pieces{display:flex;flex-wrap:wrap;gap:8px}
.bld-piece{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:2px solid #d0e4d8;background:#fff}
.bld-piece:hover{border-color:#2d7a4f;background:#f0f7f3}
.bld-piece.used{opacity:.35;cursor:default;pointer-events:none}
.ann-ph{background:#fff8e1;border-bottom:2px solid #f0c040;cursor:pointer;border-radius:3px;padding:1px 3px}
.ann-ph:hover{background:#fff0a0}
.ann-ph.a-sens{background:#e1f5ee;border-bottom-color:#1d9e75}
.ann-ph.a-show{background:#faeeda;border-bottom-color:#854f0b}
.ann-ph.a-mem{background:#e6f1fb;border-bottom-color:#185fa5}
.ann-ph.a-sig{background:#ede8fb;border-bottom-color:#533ab7}
.ann-ph.a-zoom{background:#fcf0fb;border-bottom-color:#8b2fc9}
.ann-pop{background:#fff;border:2px solid #d0e4d8;border-radius:10px;padding:12px;margin:6px 0}
.ann-choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ann-btn{padding:5px 12px;border-radius:14px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;font-family:Arial,sans-serif}
.ann-res{font-size:12px;padding:8px 10px;border-radius:6px;margin-top:6px}
.ann-res.cor{background:#e1f5ee;color:#0f6e56}
.ann-res.wrg{background:#faeeda;color:#854f0b}
.teach-box{background:#fff;border-radius:8px;padding:12px;margin-bottom:10px;font-size:13px;line-height:1.7;border:1px solid #d0e4d8}
.prz-ov{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
.prz-ov.show{display:flex}
.prz-bx{background:#fff;border-radius:20px;padding:28px;max-width:460px;width:92%;text-align:center}
.prz-icon{font-size:48px;margin-bottom:8px}
.prz-ttl{font-size:22px;font-weight:800;color:#1a3a2a;margin-bottom:6px}
.prz-sub{font-size:14px;color:#666;margin-bottom:16px}
.prz-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.prz-tab{padding:7px 16px;font-size:12px;font-weight:700;border:2px solid #d0e4d8;border-radius:18px;background:#fff;cursor:pointer;font-family:Arial,sans-serif}
.prz-tab.on{border-color:#1a3a2a;background:#e8f4ec;color:#1a3a2a}
.vid-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.vid-a{background:#eef4f0;border-radius:8px;padding:10px 8px;text-decoration:none;color:#1a3a2a;font-size:11px;font-weight:700;border:1px solid #a8d8b8;display:block;line-height:1.5}
.vid-icon{font-size:18px;margin-bottom:3px}
.kg-btn{padding:10px 28px;font-size:14px;font-weight:800;border:none;border-radius:10px;background:#1a3a2a;cursor:pointer;color:#fff;font-family:Arial,sans-serif}
@media(max-width:600px){.vs-pair{grid-template-columns:1fr}.bins{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="hdr-t">Writing About a Place</div><div class="hdr-s">Revive Tutoring</div></div>
  <button class="rst" id="rst-btn">Reset</button>
</div>
<div class="prg">
  <div class="prg-bg"><div class="prg-fill" id="pf" style="width:0%"></div></div>
  <div class="prg-txt" id="pt">0 / 13</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap" id="main"></div>
<div class="prz-ov" id="pm">
  <div class="prz-bx">
    <div class="prz-icon" id="pi">&#x1F40A;</div>
    <div class="prz-ttl">You earned a video!</div>
    <div class="prz-sub">Pick a category!</div>
    <div class="prz-tabs" id="prz-tabs-row"></div>
    <div class="vid-grid" id="vg"></div>
    <button class="kg-btn" id="kg-btn">Keep Writing!</button>
  </div>
</div>
<script>
window.onerror = function(msg, src, line, col, err) {
  var d = document.createElement('div');
  d.style.cssText = 'background:red;color:white;padding:20px;font-size:16px;position:fixed;top:0;left:0;right:0;z-index:9999;';
  d.textContent = 'JS ERROR: ' + msg + ' (line ' + line + ')';
  document.body.appendChild(d);
  return false;
};
// ===== SETUP =====
var N=13, done=[], score=0, last=0, cur=0, pvt='g';
for(var i=0;i<N;i++) done.push(false);

var VIDS={
  g:[{t:'Claude the Albino Alligator',u:'https://www.youtube.com/watch?v=BURQgUYhRIY'},{t:'Meet Claude: Famous Albino Alligator',u:'https://www.youtube.com/watch?v=OyAeB1hWHQo'},{t:'Claude Celebrates 30th Hatch Day!',u:'https://www.youtube.com/watch?v=W02BqIlF34s'},{t:"Claude's Dramatic Arrival",u:'https://www.youtube.com/watch?v=1LrSaTDsViU'}],
  d:[{t:'Ancient Sea Creatures - Mosasaurs',u:'https://www.youtube.com/watch?v=uA50yT2ZpG0'},{t:'Could Mosasaurus Survive Today?',u:'https://www.youtube.com/watch?v=hXP-NB7lCw8'},{t:'Prehistoric Ocean Was Terrifying',u:'https://www.youtube.com/watch?v=SpoqgjauXSg'},{t:'How Dinosaurs Died - Kurzgesagt',u:'https://www.youtube.com/watch?v=pjoQdz0nxf4'}],
  w:[{t:'How to Write Descriptively - TED-Ed',u:'https://www.youtube.com/watch?v=RSoRzTtwgP4'},{t:'Descriptive Writing - Figurative Language',u:'https://www.youtube.com/watch?v=bumu_PynbL8'},{t:'Where Do New Words Come From?',u:'https://www.youtube.com/watch?v=Ytr28t5VzAs'},{t:'The True Story of True - TED-Ed',u:'https://www.youtube.com/watch?v=VYFE3tYUdJU'}]
};

// ===== UTILS =====
function sv(k,v){try{localStorage.setItem('wap_'+k,v);}catch(e){}}
function ld(k){try{return localStorage.getItem('wap_'+k)||'';}catch(e){return '';}}
function clr(){try{for(var k in localStorage){if(k.indexOf('wap_')===0)localStorage.removeItem(k);}}catch(e){}}
function el(id){return document.getElementById(id);}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e;}
function restTA(){
  setTimeout(function(){
    var ts=document.querySelectorAll('textarea[id]');
    for(var i=0;i<ts.length;i++){
      var s=ld(ts[i].id);
      if(s&&!ts[i].disabled){ts[i].value=s;if(s.trim().length>10)ts[i].classList.add('ok');}
    }
  },120);
}

// ===== PROGRESS =====
function mark(i){
  if(done[i])return;
  done[i]=true;score++;
  el('pf').style.width=Math.round(score/N*100)+'%';
  el('pt').textContent=score+' / '+N;
  buildTabs();
  var m=Math.floor(score/2);
  if(m>last){last=m;setTimeout(showP,400);}
}

// ===== PRIZE =====
function setPT(t){pvt=t;showVids();}
function showVids(){
  var vg=el('vg');if(!vg)return;
  var pool=VIDS[pvt],pick=pool.slice().sort(function(){return Math.random()-.5;}).slice(0,4);
  vg.innerHTML='';
  pick.forEach(function(v){
    var a=ce('a','vid-a');a.href=v.u;a.target='_blank';
    var icon=ce('div','vid-icon');icon.textContent='▶';a.appendChild(icon);
    a.appendChild(document.createTextNode(v.t));
    vg.appendChild(a);
  });
}
function showP(){
  pvt='g';
  el('prz-tabs-row').querySelectorAll('.prz-tab').forEach(function(t,i){t.classList.toggle('on',i===0);});
  el('pi').textContent='&#x1F40A;';
  showVids();
  el('pm').classList.add('show');
}

// ===== TABS =====
var TLBL=['Wk/St','Senses','Cliches','Builder','Fossil','Swamp','Claude','Volcano','3 Moves','Brainstorm','1 Detail','Show','Write'];
function buildTabs(){
  var w=el('tabs');w.innerHTML='';
  for(var i=0;i<N;i++){
    var b=ce('button','tab'+(i===cur?' on':'')+(done[i]?' dn':''));
    b.textContent=(done[i]?'+ ':'')+TLBL[i];
    b.setAttribute('data-i',String(i));
    b.addEventListener('click',function(){cur=parseInt(this.getAttribute('data-i'));render();});
    w.appendChild(b);
  }
}

// ===== STORAGE =====
function chkTA(prefix){
  var ts=document.querySelectorAll('[id^="'+prefix+'"]');
  var ok=true;
  ts.forEach(function(ta){sv(ta.id,ta.value);if(ta.value.trim().length>10)ta.classList.add('ok');else ok=false;});
  return ok;
}

// ===== ACTIVITY 1: WEAK VS STRONG =====
var ALL_PAIRS=[
  {a:'The swamp exhibit was a dark and smelly part of the museum.',b:'The lights dimmed as I stepped into the swamp exhibit, and the air thickened around me, carrying the green wet smell of something that had been growing in the dark for a very long time.',c:'b',f:'Both describe the same place. The second puts you inside it. The first just tells you it was dark and smelly.'},
  {a:'Claude walked into the water slowly like he did not care about a thing.',b:'Claude moved through the water the way a cloud crosses a sky, not fast not slow, just inevitable, as if he had all the time in the world because he had already lived through most of it.',c:'b',f:'The first tells you he was slow. The second makes you feel the slowness through comparison.'},
  {a:'I find myself moving toward his exhibit before I decide to, pressing my hands against the cool glass and staring into the water the way you stare at a place where something used to be.',b:'Going back to the Academy makes me feel sad because Claude is not there anymore.',c:'a',f:'The second names the emotion directly. The first shows it through physical action.'},
  {a:'The tanks made a humming noise that was constant and not unpleasant.',b:'The tanks hummed at a frequency that worked itself into the floor and the walls until it became part of the silence itself, the kind of sound you only noticed when you stepped outside and it stopped.',c:'b',f:'The first describes the hum flatly. The second captures how sound works: you stop hearing it until it stops.'},
  {a:'Claude was a white alligator that looked different from regular alligators.',b:"Claude's scales caught the tank light in a way that stopped you, not the white of something clean but the white of old ivory, of bone that had rested at the bottom of something cold and dark long enough to take on its color.",c:'b',f:'The first labels the color. The second reaches for what kind of white, carrying history and age.'}
];
var vsPairs=[],vsAns={},vsCount=0;
function initPairs(){
  vsPairs=ALL_PAIRS.slice().sort(function(){return Math.random()-.5;}).slice(0,4).map(function(p){
    var f=Math.random()>.5;
    return {a:f?p.b:p.a,b:f?p.a:p.b,cs:f?(p.c==='b'?'A':'B'):(p.c==='a'?'A':'B'),f:p.f};
  });
  vsAns={};vsCount=0;
}
function pickVS(pi,ch){
  if(vsAns[pi])return;vsAns[pi]=true;vsCount++;
  var p=vsPairs[pi],ok=ch===p.cs;
  var ae=el('va'+pi),be=el('vb'+pi),fb=el('vf'+pi);
  var ce2=p.cs==='A'?ae:be,we=p.cs==='A'?be:ae;
  if(ok){ce2.classList.add('cor');we.style.opacity='.5';fb.textContent='Good eye! '+p.f;fb.className='vs-fb show cor';}
  else{we.classList.add('wrg');ce2.classList.add('rev');fb.textContent='Not quite. '+p.f;fb.className='vs-fb show wrg';}
  if(vsCount>=vsPairs.length){var d=el('vs_done');if(d)d.classList.add('show');mark(0);}
}
function renderVS(){
  initPairs();
  var wrap=ce('div');
  var inst=ce('div','inst');inst.textContent='Read each pair. Click the stronger sentence. These are harder than they look.';wrap.appendChild(inst);
  vsPairs.forEach(function(p,i){
    var box=ce('div','ex-box');
    var ttl=ce('div','ex-ttl');ttl.textContent='Pair '+(i+1);box.appendChild(ttl);
    var pair=ce('div','vs-pair');
    var oa=ce('div','vs-opt');oa.id='va'+i;oa.textContent=p.a;
    oa.addEventListener('click',function(){pickVS(i,'A');});
    var ob=ce('div','vs-opt');ob.id='vb'+i;ob.textContent=p.b;
    ob.addEventListener('click',function(){pickVS(i,'B');});
    pair.appendChild(oa);pair.appendChild(ob);box.appendChild(pair);
    var fb=ce('div','vs-fb');fb.id='vf'+i;box.appendChild(fb);
    wrap.appendChild(box);
  });
  var done_el=ce('div','done'+(done[0]?' show':''));done_el.id='vs_done';done_el.textContent='You have the eye for strong writing!';wrap.appendChild(done_el);
  return wrap;
}

// ===== ACTIVITY 2: SENSORY SORT =====
var SN_ITEMS=[{w:'the cool dim air',s:'feel',c:'#2d7a4f'},{w:'the hum of the tanks',s:'sound',c:'#185fa5'},{w:'Claude white scales',s:'sight',c:'#854f0b'},{w:'his slow blinking eye',s:'sight',c:'#854f0b'},{w:'fish and salt water',s:'smell',c:'#533ab7'},{w:'rough concrete floor',s:'feel',c:'#2d7a4f'},{w:'children whispering',s:'sound',c:'#185fa5'},{w:'green algae on glass',s:'sight',c:'#854f0b'},{w:'cold glass under fingers',s:'feel',c:'#2d7a4f'},{w:'the splash of his tail',s:'sound',c:'#185fa5'}];
var snPlaced={},snSel=null;
function selSN(i){
  if(snPlaced[i])return;
  document.querySelectorAll('.sw-word').forEach(function(e){e.style.outline='';});
  snSel=i;var e=el('sw'+i);if(e)e.style.outline='3px solid #2d7a4f';
}
function dropBin(bn){
  if(snSel===null)return;
  var item=SN_ITEMS[snSel],we=el('sw'+snSel);
  if(!item||!we)return;
  if(bn!==item.s){
    we.style.outline='3px solid #e24b4a';
    var si=snSel;snSel=null;
    setTimeout(function(){var e=el('sw'+si);if(e)e.style.outline='';},700);
    return;
  }
  var bw=el('bw'+bn);
  if(bw){var t=ce('div','placed-tag');t.style.background=item.c;t.textContent=item.w;bw.appendChild(t);}
  we.classList.add('placed');we.style.outline='';snPlaced[snSel]=true;snSel=null;
  var cnt=Object.keys(snPlaced).length;
  var sc=el('sn_sc');if(sc)sc.textContent='Sorted: '+cnt+' / 10';
  if(cnt===10){var d=el('sn_done');if(d)d.classList.add('show');mark(1);}
}
function renderSN(){
  var wrap=ce('div');
  var inst=ce('div','inst');inst.textContent='Click a detail, then click the bin where it belongs.';wrap.appendChild(inst);
  var sw=ce('div','sw');
  SN_ITEMS.forEach(function(item,i){
    var w=ce('div','sw-word'+(snPlaced[i]?' placed':''));w.id='sw'+i;w.textContent=item.w;
    w.addEventListener('click',function(){selSN(i);});
    sw.appendChild(w);
  });
  wrap.appendChild(sw);
  var bins=ce('div','bins');
  ['sight','sound','smell','feel'].forEach(function(bn){
    var b=ce('div','bin');
    var bt=ce('div','bin-ttl');bt.textContent=bn.toUpperCase();b.appendChild(bt);
    var bw=ce('div','bin-words');bw.id='bw'+bn;b.appendChild(bw);
    b.addEventListener('click',function(){dropBin(bn);});
    bins.appendChild(b);
  });
  wrap.appendChild(bins);
  var sc=ce('div');sc.id='sn_sc';sc.style.cssText='font-size:12px;color:#555;margin-top:6px;';
  sc.textContent='Sorted: '+Object.keys(snPlaced).length+' / 10';wrap.appendChild(sc);
  var dn=ce('div','done'+(done[1]?' show':''));dn.id='sn_done';dn.textContent='All sorted!';wrap.appendChild(dn);
  return wrap;
}

// ===== ACTIVITY 3: CLICHE =====
var clFound=0,clDone=false;
function clickCL(el2){
  if(el2.classList.contains('fnd'))return;
  el2.classList.add('fnd');clFound++;
  var ce2=el('cl_cnt'),ta=el('cl_ta');
  if(clFound<4){if(ce2)ce2.textContent='Found: '+clFound+' - find at least 4 before writing.';}
  else{if(ce2)ce2.textContent='Found: '+clFound+' - now rewrite!';if(ta)ta.disabled=false;}
}
function chkCL(){

  var sp34=ce('span');sp34.id='ap34';sp34.textContent='The rocks beneath your feet look young but the lava fields stretching toward the water formed before your great-grandparents drew a breath.';makeAnnotatable(sp34,34);
  var sp35=ce('span');sp35.id='ap35';sp35.textContent='the lava hisses as it meets the air, cracks where it cools too fast, pops where gas pushes through a thin crust that has not yet decided to become solid.';makeAnnotatable(sp35,35);
  p.appendChild(document.createTextNode('You smell it before you see it. '));p.appendChild(sp32);p.appendChild(document.createTextNode(' '));p.appendChild(sp31);p.appendChild(document.createTextNode(' At the edge of the flow, the lava moves slowly, '));p.appendChild(sp30);p.appendChild(document.createTextNode(' Where it cools, it hardens into ripples and folds and ropes of black glass, shapes that look almost carved, as if something patient worked them. '));p.appendChild(sp33);p.appendChild(document.createTextNode(' The rocks beneath your feet are young by any measure except a human one. '));p.appendChild(sp34);p.appendChild(document.createTextNode(' At the active vent the sounds change: '));p.appendChild(sp35);p.appendChild(document.createTextNode(' You could stand here for an hour and it would not be enough.'));
  textBox.appendChild(p);wrap.appendChild(textBox);
  var ar=ce('div');ar.id='ar30';ar.style.marginBottom='12px';wrap.appendChild(ar);
  var practiceBox=ce('div','ex-box');practiceBox.appendChild(ce('div','ex-ttl')).textContent='Practice - Write Your Own';
  var figQs=[
    {id:'mt3q0',lbl:'Simile',hint:'Crawling like rivers of fire: the writer compares lava to rivers to show its slow unstoppable movement. Write your own simile about something you will see in Hawaii. Use like or as and make the comparison earn its place.'},
    {id:'mt3q1',lbl:'Metaphor',hint:'The island is a scar that never fully heals: the writer says the island and the scar are the same thing. Write your own metaphor about the volcano, the lava, or the island. Do not use like or as.'},
    {id:'mt3q2',lbl:'Personification',hint:'The mountain exhales here: the writer gives the volcano a human body and a human action. Write your own sentence giving the volcano, the ocean, or the island a human quality. What does it do that only a living thing does?'},
    {id:'mt3q3',lbl:'Hyperbole',hint:'Old enough to have watched continents draw a breath: the writer exaggerates the age of the rock to make you feel its scale. Write your own exaggeration about something in Hawaii. Make it big enough to feel true even though it is not literally true.'},
    {id:'mt3q4',lbl:'Onomatopoeia',hint:'The lava hisses, cracks, pops: three words that sound exactly like what they describe. Write your own sentence about the volcano using at least one word that sounds like what it names.'},
    {id:'mt3q5',lbl:'Imagery',hint:'The air carries sulfur and heat and something older underneath: the writer uses smell, temperature, and age all in one sentence. Write 2-3 sentences describing what you expect to see, hear, smell, or feel standing at the edge of a lava field. No figurative language, just specific sensory details.',tall:true}
  ];
  figQs.forEach(function(q){practiceBox.appendChild(makeQ(q.lbl+': '+q.hint,makeMTTA(3,q.id,q.hint.substring(0,30)+'...',q.tall||false)));});
  wrap.appendChild(practiceBox);
  var dn=ce('div','done'+(done[7]?' show':''));dn.id='mtd3';dn.textContent='Volcano activity complete!';wrap.appendChild(dn);
  return wrap;
}

// ===== WRITING EXERCISES =====
function makeWrEx(exIdx,mapIdx,qs){
  var wrap=ce('div');
  wrap.appendChild(ce('div','inst')).textContent='Answer each question specifically.';
  qs.forEach(function(q,i){
    var ta=ce('textarea');ta.id='wr'+exIdx+'_'+i;ta.placeholder='Your answer...';if(q.tall)ta.style.minHeight='120px';
    var saved=ld(ta.id);if(saved){ta.value=saved;if(saved.trim().length>10)ta.classList.add('ok');}
    ta.addEventListener('input',function(){sv(this.id,this.value);if(this.value.trim().length>10)this.classList.add('ok');chkWrEx(exIdx,mapIdx);});
    wrap.appendChild(makeQ(q.t,ta));
  });
  var dn=ce('div','done'+(done[mapIdx]?' show':''));dn.id='wd'+exIdx;dn.textContent='Activity complete!';wrap.appendChild(dn);
  var navrow=ce('div','nav-row');
  var back=ce('button','btn btn-nav');back.textContent='Back';back.addEventListener('click',function(){cur=mapIdx-1;render();});
  if(mapIdx===0)back.style.visibility='hidden';
  var sub=ce('button','btn btn-sub');sub.id='wsub'+exIdx;sub.disabled=true;sub.textContent=done[mapIdx]?'Done!':'Mark Complete';
  sub.addEventListener('click',function(){subWrEx(exIdx,mapIdx);});
  var nxt=ce('button','btn btn-nav nxt');nxt.textContent='Next';nxt.addEventListener('click',function(){cur=mapIdx+1;render();});
  if(mapIdx===N-1)nxt.style.visibility='hidden';
  navrow.appendChild(back);navrow.appendChild(sub);navrow.appendChild(nxt);
  wrap.appendChild(navrow);
  setTimeout(function(){chkWrEx(exIdx,mapIdx);},50);
  return wrap;
}
function chkWrEx(exIdx,mapIdx){
  var ts=document.querySelectorAll('[id^="wr'+exIdx+'_"]');
  var ok=true;ts.forEach(function(ta){if(ta.value.trim().length<10)ok=false;});
  var btn=el('wsub'+exIdx);if(btn)btn.disabled=!ok;
}
function subWrEx(exIdx,mapIdx){if(done[mapIdx])return;var d=el('wd'+exIdx);if(d)d.classList.add('show');mark(mapIdx);if(mapIdx<N-1)setTimeout(function(){cur=mapIdx+1;render();},700);}

function renderShow(){
  var wrap=ce('div');
  wrap.appendChild(ce('div','inst')).textContent='Rewrite each sentence so the reader can feel what the writer means without naming the emotion.';
  var banned=ce('div','banned');banned.innerHTML='<strong>Banned words:</strong> feel, felt, happy, sad, proud, calm, scared, love, miss, wonderful, amazing, emotional';wrap.appendChild(banned);
  var box=ce('div','ex-box');box.appendChild(ce('div','ex-ttl')).textContent='How to convert telling to showing';
  var steps=[
    {t:'1. Can I film it?',b:'If you cannot point a camera at it, it is telling. "I felt proud" cannot be filmed.'},
    {t:'2. What did the body do?',b:'Replace the feeling word with a physical action.'},
    {t:'3. What did the person notice?',b:'What we pay attention to reveals how we feel.'}
  ];
  steps.forEach(function(s){var tb=ce('div','teach-box');tb.innerHTML='<strong>'+s.t+'</strong> '+s.b;box.appendChild(tb);});
  var tell=ce('div');tell.style.cssText='background:#fcebeb;padding:10px;border-radius:8px;margin-bottom:6px;font-size:13px;';tell.innerHTML='<strong>Telling:</strong> I felt nervous standing at the glass.';box.appendChild(tell);
  var show=ce('div');show.style.cssText='background:#e1f5ee;padding:10px;border-radius:8px;font-size:13px;';show.innerHTML='<strong>Showing:</strong> I pressed closer to the glass than I needed to. I held very still. I was not sure if I wanted him to look at me or not.';box.appendChild(show);
  wrap.appendChild(box);
  var tolds=['I missed Claude.','Standing there made me feel calm.','Seeing him look at me made me feel special.','I was sad the Academy felt different without him.'];
  tolds.forEach(function(told,i){
    var ta=ce('textarea');ta.id='wr11_'+i;ta.placeholder='Your version...';
    var saved=ld(ta.id);if(saved){ta.value=saved;if(saved.trim().length>10)ta.classList.add('ok');}
    ta.addEventListener('input',function(){sv(this.id,this.value);if(this.value.trim().length>10)this.classList.add('ok');chkWrEx(11,11);});
    wrap.appendChild(makeQ('Told: "'+told+'" Show it instead.',ta));
  });
  var dn=ce('div','done'+(done[11]?' show':''));dn.id='wd11';dn.textContent='Activity complete!';wrap.appendChild(dn);
  var navrow=ce('div','nav-row');
  var back=ce('button','btn btn-nav');back.textContent='Back';back.addEventListener('click',function(){cur=10;render();});
  var sub=ce('button','btn btn-sub');sub.id='wsub11';sub.disabled=true;sub.textContent=done[11]?'Done!':'Mark Complete';sub.addEventListener('click',function(){subWrEx(11,11);});
  var nxt=ce('button','btn btn-nav nxt');nxt.textContent='Next';nxt.addEventListener('click',function(){cur=12;render();});
  navrow.appendChild(back);navrow.appendChild(sub);navrow.appendChild(nxt);wrap.appendChild(navrow);
  setTimeout(function(){chkWrEx(11,11);},50);
  return wrap;
}

// ===== MAIN RENDER =====
var EX_INFO=[
  {num:'Act 1',type:'Weak vs Strong',title:'Which sentence is stronger?'},
  {num:'Act 2',type:'Sensory Sorter',title:'Sort the details by sense'},
  {num:'Act 3',type:'Cliche Detector',title:'Find and fix the weak words'},
  {num:'Act 4',type:'Build Your Opening',title:'Build your opening sentence'},
  {num:'MT 1',type:'Annotate and Close Read',title:'The Fossil Hall'},
  {num:'MT 2',type:'Annotate and Copy',title:'The Swamp'},
  {num:'MT 3',type:'Annotate and Copy',title:'Eye Contact'},
  {num:'MT 4',type:'Figurative Language',title:'The Volcano - Kilauea at Night'},
  {num:'Ex 1',type:'Three Moves',title:'Practice the three moves'},
  {num:'Ex 2',type:'Brainstorm',title:'Map your place'},
  {num:'Ex 3',type:'One Detail',title:'One detail, three sentences'},
  {num:'Ex 4',type:'Show the Feeling',title:'Show the feeling without saying it'},
  {num:'Ex 5',type:'Write Your Essay',title:'Put it all together'}
];

function render(){
  buildTabs();
  var ex=EX_INFO[cur];
  var card=ce('div','card');
  var hd=ce('div','card-hd');
  var num=ce('div','card-num');num.textContent=ex.num+' - '+ex.type;hd.appendChild(num);
  var ttl=ce('div','card-ttl');ttl.textContent=ex.title;hd.appendChild(ttl);
  card.appendChild(hd);
  var bd=ce('div','card-bd');
  var content;
  if(cur===0)content=renderVS();
  else if(cur===1)content=renderSN();
  else if(cur===2)content=renderCL();
  else if(cur===3)content=renderB();
  else if(cur===4)content=renderFossil();
  else if(cur===5)content=renderSwamp();
  else if(cur===6)content=renderEye();
  else if(cur===7)content=renderVolc();
  else if(cur===8)content=makeWrEx(8,8,[{t:'Move 1: Write one specific sensory detail that puts the reader inside the Academy immediately.'},{t:'Move 2: Write the moment with Claude you keep returning to.'},{t:'Move 3: What does the Academy mean to you now that Claude is gone? Say it in a true specific way.'}]);
  else if(cur===9)content=makeWrEx(9,9,[{t:'What is the first thing you remember when you think of the Academy?'},{t:'Write everything you remember about the moment Claude shuffled toward you and locked eyes.',tall:true},{t:'Sight: what did you see?'},{t:'Sound: what did you hear?'},{t:'Smell or Feel: what did you smell or feel?'},{t:'One small detail that sticks with you that you cannot forget.'},{t:'Why does the Academy feel different now that Claude is gone?'}]);
  else if(cur===10)content=makeWrEx(10,10,[{t:'Name the one small detail you are focusing on.'},{t:'Sentence 1: what does it look like?'},{t:'Sentence 2: what does it feel like or remind you of?'},{t:'Sentence 3: what does it make you think or wonder?'}]);
  else if(cur===11)content=renderShow();
  else if(cur===12)content=makeWrEx(12,12,[{t:'Opening: put the reader right there.',tall:true},{t:'The story: the moment Claude shuffled toward you or any memory that keeps coming back.',tall:true},{t:'What the place looks and feels like now. Zoom in on one or two things.',tall:true},{t:'Ending: what does this place mean to you now that Claude is gone?'}]);
  if(cur<=7){
    var navrow=ce('div','nav-row');
    if(cur>0){var back=ce('button','btn btn-nav');back.textContent='Back';back.addEventListener('click',function(){cur--;render();});navrow.appendChild(back);}else{navrow.appendChild(ce('div'));}
    navrow.appendChild(ce('div'));
    if(cur<N-1){var nxt=ce('button','btn btn-nav nxt');nxt.textContent='Next';nxt.addEventListener('click',function(){cur++;render();});navrow.appendChild(nxt);}else{navrow.appendChild(ce('div'));}
    content.appendChild(navrow);
  }
  bd.appendChild(content);card.appendChild(bd);
  el('main').innerHTML='';el('main').appendChild(card);
  restTA();
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetAll(){
  clr();
  done=[];for(var i=0;i<N;i++)done.push(false);
  score=0;last=0;cur=0;
  vsAns={};vsCount=0;
  snPlaced={};snSel=null;
  clFound=0;clDone=false;
  bSlots=['','',''];
  annAns={};
  el('pf').style.width='0%';el('pt').textContent='0 / '+N;
  render();
}

// ===== WIRE UP STATIC BUTTONS =====
el('rst-btn').addEventListener('click',resetAll);
el('kg-btn').addEventListener('click',function(){el('pm').classList.remove('show');});

ptab_data.forEach(function(p,i){

render();
