<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#eef4f0;color:#1a1a1a}
.hdr{background:#1a3a2a;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.hdr-t{font-size:18px;font-weight:800;color:#fff}

.tab.on{color:#1a3a2a;border-bottom-color:#2d7a4f}

.cl-w.keep{background:#f0f0f0;color:#777}
.lab-choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lab-btn{padding:6px 12px;border-radius:14px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;font-family:Arial,sans-serif}
.lab-res{font-size:12px;padding:8px 10px;border-radius:6px;margin-top:8px}
.lab-res.cor{background:#e1f5ee;color:#0f6e56}
.lab-res.wrg{background:#faeeda;color:#854f0b}
.legend{background:#fefaf3;border:2px solid #e8d8a0;border-radius:10px;padding:12px 14px;margin-bottom:14px}
.legend h4{font-size:10px;font-weight:700;color:#8b6914;letter-spacing:2px;margin-bottom:8px}
.legend .row{display:flex;flex-wrap:wrap;gap:6px}
.legend span{color:#fff;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.sw-word{padding:7px 13px;border-radius:14px;font-size:12px;font-weight:700;border:2px solid #d0e4d8;background:#fff;cursor:pointer;user-select:none;white-space:normal;text-align:left}
.sw-word.placed{opacity:.4;cursor:default}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.bin{border:2px dashed #aaa;border-radius:10px;padding:10px;min-height:80px;cursor:pointer}
.bin-ttl{font-size:12px;font-weight:700;color:#555;margin-bottom:6px;text-align:center}

.prz-bx{background:#fff;border-radius:20px;padding:28px;max-width:460px;width:92%;text-align:center}
.prz-icon{font-size:48px;margin-bottom:8px}
.prz-ttl{font-size:22px;font-weight:800;color:#1a3a2a;margin-bottom:6px}
.prz-sub{font-size:14px;color:#666;margin-bottom:16px}
.prz-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.prz-tab{padding:7px 16px;font-size:12px;font-weight:700;border:2px solid #d0e4d8;border-radius:18px;background:#fff;cursor:pointer;font-family:Arial,sans-serif}
.prz-tab.on{border-color:#1a3a2a;background:#e8f4ec;color:#1a3a2a}
.vid-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}

.vid-icon{font-size:18px;margin-bottom:3px}
.kg-btn{padding:10px 28px;font-size:14px;font-weight:800;border:none;border-radius:10px;background:#1a3a2a;cursor:pointer;color:#fff;font-family:Arial,sans-serif}
@media(max-width:600px){.vs-pair{grid-template-columns:1fr}}
</style>

<body>
<div class="hdr">
  <div><div class="hdr-t">Inference and Close Reading <span style="font-size:12px;color:#7dcca0;font-weight:700">G8-9</span></div><div class="hdr-s">Revive Tutoring</div></div>
  <div style="display:flex;gap:8px">
    <button class="rst" id="vid-btn">Brain Break</button>
    <button class="rst" id="rst-btn">Reset</button>
  </div>
</div>
<div class="prg">
  <div class="prg-bg"><div class="prg-fill" id="pf" style="width:0%"></div></div>
  <div class="prg-txt" id="pt">0 / 9</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap" id="main"></div>
<div class="prz-ov" id="pm">
  <div class="prz-bx">
    <div class="prz-icon" id="pi">&#x1F4D6;</div>
    <div class="prz-ttl">You earned a brain break!</div>
    <div class="prz-sub">Pick a category.</div>
    <div class="prz-tabs" id="prz-tabs-row"></div>
    <div class="vid-grid" id="vg"></div>
    <button class="kg-btn" id="kg-btn">Back to Reading</button>
  </div>

<script>
window.onerror = function(msg, src, line, col, err) {
  var d = document.createElement('div');
  d.style.cssText = 'background:red;color:white;padding:20px;font-size:16px;position:fixed;top:0;left:0;right:0;z-index:9999;';
  d.textContent = 'JS ERROR: ' + msg + ' (line ' + line + ')';
  document.body.appendChild(d);
  return false;
};
var N=9, done=[], score=0, cur=0, pvt='r', correct=0, lastVid=0;
for(var i=0;i<N;i++) done.push(false);

var VIDS={
  r:[{t:'Can you solve the bridge riddle?',u:'https://www.youtube.com/watch?v=7yDmGnA8Hw0'},{t:"Can you solve Einstein's riddle?",u:'https://www.youtube.com/watch?v=1rDVz_Fb6HQ'},{t:'Can you solve the prisoner hat riddle?',u:'https://www.youtube.com/watch?v=N5vJSNXPEwA'}],
  i:[{t:'How optical illusions trick your brain',u:'https://www.youtube.com/watch?v=rfdJyDfIHIc'},{t:'The McGurk Effect (an audio illusion)',u:'https://www.youtube.com/watch?v=jtsfidRq2tw'},{t:'The moon illusion',u:'https://www.youtube.com/watch?v=RXkYjL_7jME'}],
  s:[{t:"Turbulence: physics' great unsolved mystery",u:'https://www.youtube.com/watch?v=S3i6tJ4XNqA'},{t:"What would happen if you didn't sleep?",u:'https://www.youtube.com/watch?v=dqONk48l5vY'},{t:'Why do we dream?',u:'https://www.youtube.com/watch?v=2W85Dwxx218'}]
};

function sv(k,v){try{localStorage.setItem('inf89_'+k,v);}catch(e){}}
function ld(k){try{return localStorage.getItem('inf89_'+k)||'';}catch(e){return '';}}
function clr(){try{for(var k in localStorage){if(k.indexOf('inf89_')===0)localStorage.removeItem(k);}}catch(e){}}
function el(id){return document.getElementById(id);}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e;}
function restTA(){
  setTimeout(function(){
    var ts=document.querySelectorAll('textarea[id]');
    for(var i=0;i<ts.length;i++){var s=ld(ts[i].id);if(s&&!ts[i].disabled){ts[i].value=s;if(s.trim().length>10)ts[i].classList.add('ok');}}
  },120);
}
function mark(i){if(done[i])return;done[i]=true;score++;el('pf').style.width=Math.round(score/N*100)+'%';el('pt').textContent=score+' / '+N;buildTabs();}
function addCorrect(){correct++;var v=Math.floor(correct/5);if(v>lastVid){lastVid=v;setTimeout(showP,400);}}
function setPT(t){pvt=t;showVids();}
function showVids(){
  var vg=el('vg');if(!vg)return;
  var pool=VIDS[pvt],pick=pool.slice().sort(function(){return Math.random()-.5;}).slice(0,4);
  vg.innerHTML='';
  pick.forEach(function(v){var a=ce('a','vid-a');a.href=v.u;a.target='_blank';var icon=ce('div','vid-icon');icon.textContent='▶';a.appendChild(icon);a.appendChild(document.createTextNode(v.t));vg.appendChild(a);});
}
function showP(){pvt='r';el('prz-tabs-row').querySelectorAll('.prz-tab').forEach(function(t,i){t.classList.toggle('on',i===0);});el('pi').textContent='📖';showVids();el('pm').classList.add('show');}

var TLBL=['Everyday','Clue Hunt','Three Threads','Evidence','Support?','Infer','Unsaid','Watch','Together'];
function buildTabs(){
  var w=el('tabs');w.innerHTML='';
  for(var i=0;i<N;i++){
    var b=ce('button','tab'+(i===cur?' on':'')+(done[i]?' dn':''));
    b.textContent=(done[i]?'+ ':'')+TLBL[i];b.setAttribute('data-i',String(i));
    b.addEventListener('click',function(){cur=parseInt(this.getAttribute('data-i'));render();});
    w.appendChild(b);
  }
}

// ===== PASSAGE =====
var PASSAGE=[
  'Dad started sleeping in around the time the mornings turned cold. I would come down for cereal and find him at the table in yesterday\u2019s shirt, a mug going cold in front of him, the classifieds folded into a tight square he never opened while I watched. He would ask about my day before I had even had it, which annoyed me, and I gave him the shrug he deserved.',
  'The car disappeared first. He said the brakes were acting up, that it sat at Marcus\u2019s garage, but Marcus waved at us from his porch all week and never mentioned it. When I asked again, Dad steered the conversation to my history grade, which he suddenly cared about very much.',
  'Money turned strange in small ways. We ate a lot of pasta. The good cheese left the fridge and did not come back. He clipped coupons now, squinting at them under the kitchen light like they held instructions, and once I caught him carrying a bag of groceries back out to the car, items he had just brought in.',
  'Twice that month his phone rang and he stepped into the garage to answer, and through the door I heard a voice I did not recognize, bright and careful, a voice for strangers. \u201CAbsolutely,\u201D he kept saying. \u201CWhatever you need from my end.\u201D His good suit hung pressed on the closet door for a week, then went back in the closet without a wrinkle.',
  'I told my friends my dad had gotten lazy. I said it like a complaint, the way you do when you want someone to agree with you. They did. It was easier than the other thing, the thing I could see if I looked, sitting just behind his too-bright voice and his folded newspaper, waiting for me to be old enough to say it out loud.'
];
function buildPassage(){
  var box=ce('div','passage');
  box.appendChild(ce('div','ttl')).textContent='The Pressed Suit';
  PASSAGE.forEach(function(t){var p=ce('p');p.textContent=t;box.appendChild(p);});
  return box;
}

// ===== PICKERS (0 Everyday, 3 Evidence to Conclusion) =====
var PICK={
  0:[
    {clue:'Your friend insists she is "totally fine" about losing the election, then spends all of lunch listing everything the winner did wrong.',a:'She is fine, and just analyzing the race objectively.',b:'She is more stung by the loss than she will admit.',c:'b',f:'Her words claim calm, but her actions, a lunch spent attacking the winner, point the other way. When words and behavior split, weight the behavior.'},
    {clue:'A neighbor whose lawn was always immaculate lets it grow wild for a month, and the curtains stay drawn at noon.',a:'The neighbor has simply gotten lazy about the yard.',b:'Something in the household has changed, though this alone cannot tell you what.',c:'b',f:'"Lazy" is the easy label, and a sharp break from a long habit usually signals a cause. A careful reader marks the change without inventing the reason.'},
    {clue:'A narrator tells you his rival "cheated his way" to first chair, offering no proof, only that the rival "always had it out for me."',a:'The rival most likely cheated.',b:'The narrator\u2019s grudge makes him an unreliable judge of this.',c:'b',f:'The only evidence is the narrator\u2019s resentment. A reader weighs the source: a biased narrator\u2019s accusation, with no proof, supports a conclusion about him, not about the rival.'},
    {clue:'During the closing scene, the audience sees a letter slip unnoticed from the hero\u2019s coat just before he declares he has "nothing left to lose."',a:'The hero has truly lost everything.',b:'The audience knows something the hero does not, and the scene runs on that gap.',c:'b',f:'You saw the letter fall; he did not. That gap between what the audience knows and what the character believes is dramatic irony, and the writer built the scene on it.'}
  ],
  3:[
    {clue:'Evidence: The classifieds sit folded into a tight square he never opens while the narrator watches.',a:'Dad keeps a tidy house and dislikes clutter.',b:'Dad reads the job listings, and hides that he is doing it.',c:'b',f:'A folded-but-unread paper he will not open in front of his child points past tidiness to secrecy. The detail he hides is the one that matters.'},
    {clue:'Evidence: Dad answers calls in the garage in a bright, careful "voice for strangers," repeating "Whatever you need from my end."',a:'Dad is catching up with old friends he wants to impress.',b:'Dad is interviewing or pitching himself to potential employers.',c:'b',f:'A rehearsed voice "for strangers," the private location, and the eager deference all read as someone selling himself for work, not chatting with friends.'},
    {clue:'Evidence: The narrator calls his father "lazy," then admits he said it "the way you do when you want someone to agree with you."',a:'The narrator is certain his father has grown lazy.',b:'The narrator suspects the harder truth and chooses the easier story on purpose.',c:'b',f:'He confesses the move: he wanted agreement, not accuracy. The line exposes a narrator managing his own discomfort, not reporting a fact.'},
    {clue:'Evidence: Dad carries a bag of groceries back out to the car, items he had just brought inside.',a:'Dad forgot he already owned those items.',b:'Dad realized, at the counter or the car, that the family cannot afford them.',c:'b',f:'Carrying food back out, right after bringing it in, reads as a quiet retreat over money, not forgetfulness. The reversal is the clue.'}
  ]
};
var pickAns={0:{},3:{}}, pickCount={0:0,3:0};
function pickClick(act,pi,ch){
  if(pickAns[act][pi])return;pickAns[act][pi]=true;pickCount[act]++;
  var p=PICK[act][pi],ok=ch===p.c;
  var ae=el('p'+act+'a'+pi),be=el('p'+act+'b'+pi),fb=el('p'+act+'f'+pi);
  var cor=p.c==='a'?ae:be,wrg=p.c==='a'?be:ae;
  if(ok){cor.classList.add('cor');wrg.style.opacity='.5';fb.textContent='Yes. '+p.f;fb.className='vs-fb show cor';addCorrect();}
  else{wrg.classList.add('wrg');cor.classList.add('rev');fb.textContent='Look again. '+p.f;fb.className='vs-fb show wrg';}
  if(pickCount[act]>=PICK[act].length){var d=el('pk'+act+'_done');if(d)d.classList.add('show');mark(act);}
}
function renderPick(act,instTxt,doneTxt,lblTxt,withPassage){
  var wrap=ce('div');
  wrap.appendChild(ce('div','inst')).textContent=instTxt;
  if(withPassage)wrap.appendChild(buildPassage());
  PICK[act].forEach(function(p,i){
    var box=ce('div','ex-box');
    var cl=ce('div','clue-lbl');var cll=ce('div','lbl');cll.textContent=lblTxt;cl.appendChild(cll);
    cl.appendChild(document.createTextNode(p.clue));box.appendChild(cl);
    var pair=ce('div','vs-pair');
    var oa=ce('div','vs-opt');oa.id='p'+act+'a'+i;oa.textContent=p.a;oa.addEventListener('click',function(){pickClick(act,i,'a');});
    var ob=ce('div','vs-opt');ob.id='p'+act+'b'+i;ob.textContent=p.b;ob.addEventListener('click',function(){pickClick(act,i,'b');});
    pair.appendChild(oa);pair.appendChild(ob);box.appendChild(pair);
    var fb=ce('div','vs-fb');fb.id='p'+act+'f'+i;box.appendChild(fb);
    wrap.appendChild(box);
  });
  var dn=ce('div','done'+(done[act]?' show':''));dn.id='pk'+act+'_done';dn.textContent=doneTxt;wrap.appendChild(dn);
  return wrap;
}

// ===== CLUE HUNT (act 1) =====
var CLUE_DATA=[
  {word:'He asked about my day before I had even had it, which annoyed me.',clue:false},
  {word:'The classifieds sat folded into a tight square he never opened while I watched.',clue:true},
  {word:'Rain streaked the kitchen window for most of that week.',clue:false},
  {word:'He said the car was at Marcus\u2019s garage, but Marcus waved at us all week and never mentioned it.',clue:true},
  {word:'The good cheese left the fridge and did not come back, and we ate a lot of pasta.',clue:true},
  {word:'He clipped coupons now, squinting at them like they held instructions.',clue:true},
  {word:'The mug on the table left a pale ring on the wood.',clue:false},
  {word:'Once I caught him carrying a bag of groceries back out to the car, items he had just brought in.',clue:true},
  {word:'Through the door I heard a bright, careful voice, a voice for strangers: "Whatever you need from my end."',clue:true},
  {word:'The radio played the same traffic report every morning.',clue:false},
  {word:'His good suit hung pressed on the closet door for a week, then went back in without a wrinkle.',clue:true},
  {word:'I told my friends my dad had gotten lazy, the way you do when you want someone to agree with you.',clue:true}
];
var clFound=0;
function clickCL(el2){
  if(el2.classList.contains('fnd')||el2.classList.contains('keep'))return;
  var cnt=el('cl_cnt'),fb=el('cl_fb');
  if(el2.getAttribute('data-clue')!=='1'){
    el2.classList.add('keep');
    if(fb){fb.textContent='That line sets the scene, but it carries no hidden meaning. Hunt for the details that imply something the narrator never states.';fb.style.color='#777';}
    return;
  }
  el2.classList.add('fnd');clFound++;addCorrect();
  if(fb){fb.textContent='A clue. Ask what it implies, and notice what the narrator refuses to name.';fb.style.color='#0f6e56';}
  if(clFound<6){if(cnt)cnt.textContent='Clues found: '+clFound+' / 6 needed';}
  else{if(cnt)cnt.textContent='Clues found: '+clFound+'. You read past the narrator to the truth underneath.';var d=el('cl_done');if(d)d.classList.add('show');mark(1);}
}
function renderCL(){
  var wrap=ce('div');
  wrap.appendChild(ce('div','inst')).textContent='The narrator reports the surface and avoids the truth. Read closely. Click each sentence you judge to be a clue, a detail that implies something the narrator will not say outright. Leave the lines that only set the scene. Find at least six clues to finish.';
  var box=ce('div','passage');
  box.appendChild(ce('div','ttl')).textContent='The Pressed Suit (excerpt)';
  var para=ce('div','cl-para');
  CLUE_DATA.forEach(function(d){
    var sp=ce('span','cl-w');sp.textContent=d.word;sp.setAttribute('data-clue',d.clue?'1':'0');sp.addEventListener('click',function(){clickCL(this);});para.appendChild(sp);
    para.appendChild(document.createTextNode(' '));
  });
  box.appendChild(para);wrap.appendChild(box);
  var cnt=ce('div');cnt.id='cl_cnt';cnt.style.cssText='font-size:12px;color:#555;margin-bottom:4px;font-weight:700;';
  cnt.textContent=clFound<6?('Clues found: '+clFound+' / 6 needed'):('Clues found: '+clFound+'. You read past the narrator to the truth underneath.');wrap.appendChild(cnt);
  var fb=ce('div');fb.id='cl_fb';fb.style.cssText='font-size:12px;margin-bottom:10px;min-height:16px;';wrap.appendChild(fb);
  var dn=ce('div','done'+(done[1]?' show':''));dn.id='cl_done';dn.textContent='You found the clues the narrator hides in plain sight.';wrap.appendChild(dn);
  return wrap;
}

// ===== THREE THREADS (label cards, act 2) =====
var THREADS=['money is tight','Dad is hiding it','the narrator looks away'];
var THREAD_COLORS={'money is tight':'#854f0b','Dad is hiding it':'#185fa5','the narrator looks away':'#6b4fa3'};
var LABEL=[
  {t:'The good cheese leaves the fridge, and dinner turns to pasta most nights.',l:'money is tight',w:'Small cuts to ordinary food signal a budget under strain. That thread is money.'},
  {t:'He clips coupons, squinting at them like they hold instructions.',l:'money is tight',w:'A man unused to coupons studying them closely shows money has suddenly started to matter. That thread is money.'},
  {t:'He says the car is "at the garage," though Marcus never mentions it.',l:'Dad is hiding it',w:'The cover story falls apart against Marcus\u2019s silence. Dad is managing what his child is allowed to know. That thread is hiding.'},
  {t:'He answers calls in the garage, in a bright voice he saves for strangers.',l:'Dad is hiding it',w:'He takes the calls out of earshot and performs a confident self. He is concealing the search and the strain. That thread is hiding.'},
  {t:'The pressed suit waits on the door for a week, then returns to the closet unworn.',l:'Dad is hiding it',w:'The suit readies him for something that does not happen, and he says nothing about it. That thread is hiding.'},
  {t:'He tells his friends, and himself, that his dad "got lazy."',l:'the narrator looks away',w:'The narrator reaches for the easy word so he will not have to hold the hard one. That thread is the narrator looking away.'},
  {t:'He calls it "easier than the other thing, the thing I could see if I looked."',l:'the narrator looks away',w:'He admits, almost, that he already knows and chooses not to look. That thread is the narrator looking away.'}
];
var labAns={};
function labPick(i,choice,box){
  if(labAns[i])return;labAns[i]=true;
  var item=LABEL[i],ok=choice===item.l;
  if(ok)addCorrect();
  box.querySelectorAll('.lab-btn').forEach(function(b){b.disabled=true;if(b.getAttribute('data-c')===item.l){b.style.background=THREAD_COLORS[item.l];b.style.color='#fff';}});
  var res=ce('div','lab-res '+(ok?'cor':'wrg'));res.innerHTML=(ok?'Yes. ':'Reconsider. ')+'<strong>'+item.l+'</strong>: '+item.w;box.appendChild(res);
  var all=true;for(var k=0;k<LABEL.length;k++){if(!labAns[k])all=false;}
  if(all){var d=el('lab_done');if(d)d.classList.add('show');mark(2);}
}
function renderThreads(){
  var wrap=ce('div');
  wrap.appendChild(ce('div','inst')).textContent='Three threads run under this passage at once: the family\u2019s money is tight, Dad is hiding the truth, and the narrator looks away from it. Read each detail and choose the thread it belongs to.';
  var legend=ce('div','legend');legend.appendChild(ce('h4',null,'THE THREE THREADS'));
  var row=ce('div','row');THREADS.forEach(function(s){var sp=ce('span');sp.style.background=THREAD_COLORS[s];sp.textContent=s;row.appendChild(sp);});
  legend.appendChild(row);wrap.appendChild(legend);
  LABEL.forEach(function(item,i){
    var box=ce('div','ex-box');
    box.appendChild(ce('div','card-txt')).textContent=item.t;
    var choices=ce('div','lab-choices');
    THREADS.forEach(function(s){var col=THREAD_COLORS[s];var btn=ce('button','lab-btn');btn.style.cssText='background:'+col+'22;color:'+col+';border-color:'+col+';';btn.textContent=s;btn.setAttribute('data-c',s);btn.addEventListener('click',function(){labPick(i,s,box);});choices.appendChild(btn);});
    box.appendChild(choices);wrap.appendChild(box);
  });
  var dn=ce('div','done'+(done[2]?' show':''));dn.id='lab_done';dn.textContent='You traced all three threads through the passage.';wrap.appendChild(dn);
  return wrap;
}

// ===== SORTER (act 4 Supported / Overreach) =====
var SO_ITEMS=[
  {w:'The father has lost his job or his income.',s:'sup'},
  {w:'The father is hiding his situation from his child.',s:'sup'},
  {w:'The family is short on money.',s:'sup'},
  {w:'The narrator partly senses the truth already.',s:'sup'},
  {w:'The father was fired for doing his job badly.',s:'over'},
  {w:'The family will lose their home.',s:'over'},
  {w:'The father will land a new job within the month.',s:'over'},
  {w:'The narrator resents and blames his father.',s:'over'}
];
var soPlaced={},soSel=null;
function selSO(i){if(soPlaced[i])return;document.querySelectorAll('.sw-word').forEach(function(e){e.style.outline='';});soSel=i;var e=el('so'+i);if(e)e.style.outline='3px solid #2d7a4f';}
function dropSO(bn){
  if(soSel===null)return;var item=SO_ITEMS[soSel],we=el('so'+soSel);if(!item||!we)return;
  if(bn!==item.s){we.style.outline='3px solid #e24b4a';var si=soSel;soSel=null;setTimeout(function(){var e=el('so'+si);if(e)e.style.outline='';},700);return;}
  var bw=el('sob'+bn);if(bw){var t=ce('div','placed-tag');t.style.background=bn==='sup'?'#2d7a4f':'#a32d2d';t.textContent=item.w;bw.appendChild(t);}
  we.classList.add('placed');we.style.outline='';soPlaced[soSel]=true;soSel=null;addCorrect();
  var cnt=Object.keys(soPlaced).length;var sc=el('so_sc');if(sc)sc.textContent='Sorted: '+cnt+' / 8';
  if(cnt===8){var d=el('so_done');if(d)d.classList.add('show');mark(4);}
}
function renderSort(){
  var wrap=ce('div');
  wrap.appendChild(ce('div','inst')).textContent='A supported inference stays inside what the text can prove. An overreach adds specifics the text never gives, about cause, degree, or the future. Click a statement, then click its bin.';
  var sw=ce('div','sw');
  SO_ITEMS.forEach(function(item,i){var w=ce('div','sw-word'+(soPlaced[i]?' placed':''));w.id='so'+i;w.textContent=item.w;w.style.maxWidth='100%';w.addEventListener('click',function(){selSO(i);});sw.appendChild(w);});
  wrap.appendChild(sw);
  var bins=ce('div','bins');
  [['sup','SUPPORTED BY THE TEXT'],['over','OVERREACH']].forEach(function(b){var bx=ce('div','bin');var bt=ce('div','bin-ttl');bt.textContent=b[1];bx.appendChild(bt);var bw=ce('div','bin-words');bw.id='sob'+b[0];bx.appendChild(bw);bx.addEventListener('click',function(){dropSO(b[0]);});bins.appendChild(bx);});
  wrap.appendChild(bins);
  var sc=ce('div');sc.id='so_sc';sc.style.cssText='font-size:12px;color:#555;margin-top:6px;';sc.textContent='Sorted: '+Object.keys(soPlaced).length+' / 8';wrap.appendChild(sc);
  var dn=ce('div','done'+(done[4]?' show':''));dn.id='so_done';dn.textContent='You can separate a grounded inference from an overreach.';wrap.appendChild(dn);
  return wrap;
}

// ===== VIDEO (act 7) =====
function buildVideo(){
  var box=ce('div','ex-box');
  box.appendChild(ce('div','ex-ttl')).textContent='Watch: "Snack Attack" (about 4 minutes, no words)';
  var note=ce('div');note.style.cssText='font-size:12px;color:#555;line-height:1.6;margin-bottom:10px;';note.textContent='The film has no dialogue, so you read faces, actions, and reactions to follow the story. Watch it once all the way through before you answer.';box.appendChild(note);
  var a=ce('a');a.href='https://www.youtube.com/watch?v=reRcVxAWT1g';a.target='_blank';a.textContent='\u25B6  Watch "Snack Attack" on YouTube (opens in a new tab)';a.style.cssText='display:inline-block;padding:11px 20px;background:#1a3a2a;color:#fff;font-size:13px;font-weight:700;border-radius:10px;text-decoration:none;';box.appendChild(a);
  return box;
}

// ===== WRITING (5,6,7,8) =====
function makeQ(lbl,ta){var q=ce('div','q');var ql=ce('div','q-lbl');ql.textContent=lbl;q.appendChild(ql);q.appendChild(ta);return q;}
function makeWrEx(exIdx,mapIdx,qs,intro,topNode){
  var wrap=ce('div');
  wrap.appendChild(ce('div','inst')).textContent=intro;
  if(topNode)wrap.appendChild(topNode);
  qs.forEach(function(q,i){
    var ta=ce('textarea');ta.id='wr'+exIdx+'_'+i;ta.placeholder='Write here...';if(q.tall)ta.style.minHeight='130px';
    var saved=ld(ta.id);if(saved){ta.value=saved;if(saved.trim().length>10)ta.classList.add('ok');}
    ta.addEventListener('input',function(){sv(this.id,this.value);if(this.value.trim().length>10)this.classList.add('ok');chkWrEx(exIdx,mapIdx);});
    wrap.appendChild(makeQ(q.t,ta));
  });
  var dn=ce('div','done'+(done[mapIdx]?' show':''));dn.id='wd'+exIdx;dn.textContent='Activity complete.';wrap.appendChild(dn);
  var navrow=ce('div','nav-row');
  var back=ce('button','btn btn-nav');back.textContent='Back';back.addEventListener('click',function(){cur=mapIdx-1;render();});if(mapIdx===0)back.style.visibility='hidden';
  var sub=ce('button','btn btn-sub');sub.id='wsub'+exIdx;sub.disabled=true;sub.textContent=done[mapIdx]?'Done':'Mark Complete';sub.addEventListener('click',function(){subWrEx(exIdx,mapIdx);});
  var nxt=ce('button','btn btn-nav nxt');nxt.textContent='Next';nxt.addEventListener('click',function(){cur=mapIdx+1;render();});if(mapIdx===N-1)nxt.style.visibility='hidden';
  navrow.appendChild(back);navrow.appendChild(sub);navrow.appendChild(nxt);wrap.appendChild(navrow);
  setTimeout(function(){chkWrEx(exIdx,mapIdx);},50);
  return wrap;
}
function chkWrEx(exIdx,mapIdx){var ts=document.querySelectorAll('[id^="wr'+exIdx+'_"]');var ok=true;ts.forEach(function(ta){if(ta.value.trim().length<10)ok=false;});var btn=el('wsub'+exIdx);if(btn)btn.disabled=!ok;}
function subWrEx(exIdx,mapIdx){if(done[mapIdx])return;var d=el('wd'+exIdx);if(d)d.classList.add('show');mark(mapIdx);if(mapIdx<N-1)setTimeout(function(){cur=mapIdx+1;render();},700);}

// ===== RENDER =====
var EX_INFO=[
  {num:'Part 1',type:'Everyday Inference',title:'Weigh the better reading'},
  {num:'Part 2',type:'Clue Hunt',title:'Find the clues in the passage'},
  {num:'Part 3',type:'The Three Threads',title:'Money, hiding, looking away'},
  {num:'Part 4',type:'From Evidence to Conclusion',title:'Which inference holds up?'},
  {num:'Part 5',type:'Supported or Overreach',title:'How far can the clues take you?'},
  {num:'Ex 1',type:'Infer and Defend',title:'Build it, then defend it'},
  {num:'Ex 2',type:'Reading the Unsaid',title:'Infer from everyday scenes'},
  {num:'Ex 3',type:'Watch and Infer',title:'Dramatic irony on film'},
  {num:'Ex 4',type:'Put It Together',title:'Synthesis and craft'}
];
var WRITE_ACTS=[5,6,7,8];
function render(){
  buildTabs();
  var ex=EX_INFO[cur];
  var card=ce('div','card');var hd=ce('div','card-hd');
  hd.appendChild(ce('div','card-num')).textContent=ex.num+' - '+ex.type;
  hd.appendChild(ce('div','card-ttl')).textContent=ex.title;card.appendChild(hd);
  var bd=ce('div','card-bd');var content;
  if(cur===0)content=renderPick(0,'An inference combines a clue with what you already know. Often more than one reading looks possible. Choose the one the evidence supports best, the reading that explains every clue, weighs the source, and assumes the least.','You can choose the stronger reading among close options.','THINK ABOUT IT',false);
  else if(cur===1)content=renderCL();
  else if(cur===2)content=renderThreads();
  else if(cur===3)content=renderPick(3,'Strong inference moves from evidence to conclusion without leaping. Read each piece of evidence from "The Pressed Suit." Choose the conclusion it supports best.','You matched each conclusion to its evidence without overreaching.','EVIDENCE',true);
  else if(cur===4)content=renderSort();
  else if(cur===5)content=makeWrEx(5,5,[
    {t:'In one precise sentence, state what is really happening with the narrator\u2019s father. The text never says it outright.'},
    {t:'Cite two specific details from the passage that support your inference, and explain how each one works as a clue.',tall:true},
    {t:'The narrator concludes his father "got lazy." Explain why the text invites you to reject that reading, and what the narrator gains by choosing it anyway.',tall:true}
  ],'Build one inference about the father, ground it in the text, then defend it against the narrator\u2019s own easier explanation.',buildPassage());
  else if(cur===6)content=makeWrEx(6,6,[
    {t:'Scene 1: A coworker says she "asked to move to mornings," but you know she was reassigned after a closed-door meeting with the manager. What does the gap between her account and the facts suggest, and which detail reveals it?'},
    {t:'Scene 2: A friend keeps insisting on paying for everyone\u2019s snacks this week and waves off every offer to split, though last month he borrowed lunch money twice. What might this suggest, and why should you resist settling on one simple explanation?',tall:true},
    {t:'Scene 3: A narrator tells you her sister "loves" the small bedroom and "insisted" on it, while every detail shows the sister lingering in the doorway of the larger one. What is the narrator doing, and how do you know?',tall:true}
  ],'Infer from each scene, and name the exact detail that carries the inference. Two of these turn on a gap between what a person claims and what the facts show.');
  else if(cur===7)content=makeWrEx(7,7,[
    {t:'Alignment: The film spends its first half locking you into the woman\u2019s point of view. Identify two specific techniques the filmmaker uses to make you share her assumption, and explain how each one steers your inference.',tall:true},
    {t:'What it reveals: The woman reads the young man through her own assumptions, much as the narrator of "The Pressed Suit" reads his father. What assumption is she protecting, and what does her misreading reveal about her rather than about him?',tall:true},
    {t:'The turn: Pinpoint the exact moment the film reverses your inference. On a second viewing, name one earlier detail that already contradicted her reading, and explain why you missed it the first time.',tall:true},
    {t:'Argument: In a developed paragraph, argue what the film says about judgment and assumption, and analyze how the gap between what the audience concludes and what the woman concludes delivers that message. Support your claim with at least two specific moments.',tall:true}
  ],'Dramatic irony, the gap between what the audience knows and what the character believes, drives this film, and the filmmaker controls that gap on purpose. Watch it once, then answer with specific shots and moments. Plan to rewatch for the last two questions.',buildVideo());
  else if(cur===8)content=makeWrEx(8,8,[
    {t:'State the central inference "The Pressed Suit" asks you to make about the father, in one precise sentence.'},
    {t:'Trace three clues across the passage, in the order they appear, and explain how the inference deepens with each one.',tall:true},
    {t:'Craft analysis: The writer filters everything through a narrator who will not name what is happening. In a paragraph, explain why a writer would choose an unaware or avoidant narrator, and what that choice does to the reader.',tall:true}
  ],'Pull every skill together. Build the central inference, trace how the passage builds it, then analyze the writer\u2019s choice of narrator.',buildPassage());
  if(WRITE_ACTS.indexOf(cur)===-1){
    var navrow=ce('div','nav-row');
    if(cur>0){var back=ce('button','btn btn-nav');back.textContent='Back';back.addEventListener('click',function(){cur--;render();});navrow.appendChild(back);}else{navrow.appendChild(ce('div'));}
    navrow.appendChild(ce('div'));
    if(cur<N-1){var nxt=ce('button','btn btn-nav nxt');nxt.textContent='Next';nxt.addEventListener('click',function(){cur++;render();});navrow.appendChild(nxt);}else{navrow.appendChild(ce('div'));}
    content.appendChild(navrow);
  }
  bd.appendChild(content);card.appendChild(bd);
  el('main').innerHTML='';el('main').appendChild(card);
  restTA();window.scrollTo({top:0,behavior:'smooth'});
}
function resetAll(){
  clr();done=[];for(var i=0;i<N;i++)done.push(false);
  score=0;cur=0;correct=0;lastVid=0;clFound=0;labAns={};
  pickAns={0:{},3:{}};pickCount={0:0,3:0};soPlaced={};soSel=null;
  el('pf').style.width='0%';el('pt').textContent='0 / '+N;render();
}
el('rst-btn').addEventListener('click',resetAll);
el('vid-btn').addEventListener('click',showP);
el('kg-btn').addEventListener('click',function(){el('pm').classList.remove('show');});
var ptab_data=[{t:'Riddles',k:'r'},{t:'Illusions',k:'i'},{t:'Weird Science',k:'s'}];
ptab_data.forEach(function(p,i){var b=ce('button','prz-tab'+(i===0?' on':''));b.textContent=p.t;b.addEventListener('click',function(){el('prz-tabs-row').querySelectorAll('.prz-tab').forEach(function(t){t.classList.remove('on');});this.classList.add('on');setPT(p.k);});el('prz-tabs-row').appendChild(b);});
render();
</script>
