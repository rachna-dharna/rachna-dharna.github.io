<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Six Syllable Types — Revive Tutoring</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', system-ui, sans-serif; background: #f0f4ff; color: #1a1a1a; min-height: 100vh; }
.header { background: #2E4057; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
.header-title { font-size: 20px; font-weight: 800; color: white; }
.header-sub { font-size: 12px; color: rgba(255,255,255,0.6); }
.reset-btn { padding: 6px 14px; font-size: 12px; border: 1px solid rgba(255,255,255,0.4); border-radius: 8px; background: transparent; cursor: pointer; color: white; }
.score-bar { background: #fff; padding: 10px 20px; border-bottom: 1px solid #e0e8f0; display: flex; align-items: center; gap: 12px; }
.score-bar-bg { flex: 1; background: #e0e8f0; border-radius: 999px; height: 12px; overflow: hidden; }
.score-bar-fill { height: 100%; background: linear-gradient(90deg, #1D9E75, #0F6E56); border-radius: 999px; transition: width 0.4s; }
.score-label { font-size: 13px; font-weight: 700; color: #555; white-space: nowrap; }
.prize-label { font-size: 12px; color: #888; white-space: nowrap; }

/* SYLLABLE TYPE TABS */
.syllable-tabs { display: flex; overflow-x: auto; background: #fff; border-bottom: 2px solid #e0e8f0; padding: 0 8px; }
.syllable-tab { padding: 12px 16px; font-size: 13px; font-weight: 700; border: none; background: transparent; cursor: pointer; color: #888; white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
.syllable-tab.active { color: #2E4057; border-bottom-color: #2E4057; }
.syllable-tab:hover { color: #2E4057; }

/* GRADE TABS */
.grade-tabs { display: flex; gap: 8px; padding: 14px 20px 0; }
.grade-tab { padding: 8px 20px; font-size: 13px; font-weight: 700; border: 2px solid #e0e8f0; border-radius: 20px; background: #fff; cursor: pointer; color: #888; transition: all 0.2s; }
.grade-tab.active { border-color: #1D9E75; background: #E1F5EE; color: #0F6E56; }

.content { padding: 16px 20px; max-width: 860px; margin: 0 auto; }
.syllable-panel { display: none; }
.syllable-panel.active { display: block; }
.grade-panel { display: none; }
.grade-panel.active { display: block; }

/* RULE CARD */
.rule-card { border-radius: 14px; padding: 16px 20px; margin-bottom: 16px; border: 2px solid; }
.rule-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
.rule-body { font-size: 14px; line-height: 1.7; }
.rule-examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.rule-example { padding: 6px 14px; border-radius: 20px; font-size: 15px; font-weight: 700; }

/* ACTIVITY SECTION */
.activity-title { font-size: 15px; font-weight: 800; color: #2E4057; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 2px solid #e0e8f0; }
.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
.word-card { background: #fff; border: 2px solid #e0e8f0; border-radius: 12px; padding: 14px 8px; text-align: center; cursor: default; transition: border-color 0.2s; }
.word-card.correct { border-color: #1D9E75; background: #E1F5EE; }
.word-card.incorrect { border-color: #E24B4A; background: #FCEBEB; }
.word-big { font-size: 22px; font-weight: 800; color: #185FA5; margin-bottom: 4px; }
.word-type { font-size: 11px; color: #888; margin-bottom: 8px; }
.card-btns { display: flex; gap: 4px; justify-content: center; }
.card-btn { padding: 4px 10px; font-size: 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-family: inherit; }
.card-btn.yes { border-color: #1D9E75; color: #0F6E56; }
.card-btn.yes:hover { background: #E1F5EE; }
.card-btn.no { border-color: #E24B4A; color: #A32D2D; }
.card-btn.no:hover { background: #FCEBEB; }

/* SORT ACTIVITY */
.sort-intro { font-size: 14px; color: #555; margin-bottom: 12px; line-height: 1.6; }
.sort-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-bottom: 14px; }
.sort-word { background: #fff; border: 2px solid #e0e8f0; border-radius: 10px; padding: 10px 8px; text-align: center; font-size: 18px; font-weight: 800; color: #185FA5; cursor: pointer; transition: all 0.2s; }
.sort-word:hover { border-color: #185FA5; }
.sort-word.sorted-yes { border-color: #1D9E75; background: #E1F5EE; color: #0F6E56; }
.sort-word.sorted-no { border-color: #E24B4A; background: #FCEBEB; color: #A32D2D; }
.sort-bins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.sort-bin { border: 2px dashed #ccc; border-radius: 12px; padding: 12px; min-height: 80px; }
.sort-bin-title { font-size: 13px; font-weight: 700; color: #555; margin-bottom: 8px; text-align: center; }
.sort-bin.bin-yes { border-color: #1D9E75; }
.sort-bin.bin-no { border-color: #E24B4A; }

/* BLEND ACTIVITY */
.blend-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.blend-card { background: #fff; border: 2px solid #e0e8f0; border-radius: 12px; padding: 14px 18px; transition: border-color 0.2s; }
.blend-card.correct { border-color: #1D9E75; background: #f0faf6; }
.blend-card.incorrect { border-color: #E24B4A; }
.blend-prompt { font-size: 13px; color: #888; margin-bottom: 6px; }
.blend-sounds { font-size: 26px; font-weight: 800; color: #185FA5; letter-spacing: 4px; margin-bottom: 8px; }
.blend-answer { font-size: 15px; color: #1D9E75; font-weight: 700; display: none; margin-bottom: 8px; }
.blend-answer.show { display: block; }
.blend-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.blend-btn { padding: 6px 14px; font-size: 13px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-family: inherit; font-weight: 600; }
.blend-btn.reveal { border-color: #185FA5; color: #185FA5; }
.blend-btn.reveal:hover { background: #E6F1FB; }
.blend-btn.yes { border-color: #1D9E75; color: #0F6E56; }
.blend-btn.yes:hover { background: #E1F5EE; }
.blend-btn.no { border-color: #E24B4A; color: #A32D2D; }
.blend-btn.no:hover { background: #FCEBEB; }

/* PRIZE */
.prize-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); z-index: 200; align-items: center; justify-content: center; }
.prize-overlay.show { display: flex; }
.prize-box { background: #fff; border-radius: 20px; padding: 2rem; max-width: 420px; width: 90%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
.prize-stars { font-size: 40px; margin-bottom: 8px; }
.prize-title { font-size: 24px; font-weight: 800; color: #2E4057; margin-bottom: 6px; }
.prize-sub { font-size: 14px; color: #666; margin-bottom: 1.25rem; }
.video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1.25rem; }
.video-link { background: #f0f4ff; border-radius: 10px; padding: 12px 8px; text-decoration: none; color: #185FA5; font-size: 12px; font-weight: 700; border: 1px solid #c8d8f0; display: block; line-height: 1.5; transition: background 0.2s; }
.video-link:hover { background: #dce8fb; }
.video-icon { font-size: 20px; margin-bottom: 4px; }
.keep-going { padding: 10px 28px; font-size: 14px; border: 2px solid #1D9E75; border-radius: 10px; background: #1D9E75; cursor: pointer; color: white; font-weight: 800; font-family: inherit; }
.keep-going:hover { background: #0F6E56; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">Six Syllable Types</div>
    <div class="header-sub">Revive Tutoring</div>
  </div>
  <button class="reset-btn" onclick="resetAll()">↺ Reset</button>
</div>

<div class="score-bar">
  <div class="score-bar-bg"><div class="score-bar-fill" id="prog" style="width:0%"></div></div>
  <div class="score-label" id="score-label">0 ⭐</div>
  <div class="prize-label" id="prize-label">5 for a prize! 🎁</div>
</div>

<div class="syllable-tabs" id="syllable-tabs"></div>

<div id="grade-tabs-wrap" style="background:#fff; border-bottom:1px solid #e0e8f0;">
  <div class="grade-tabs" id="grade-tabs"></div>
  <div style="height:12px;"></div>
</div>

<div class="content" id="main-content"></div>

<div class="prize-overlay" id="prize-modal">
  <div class="prize-box">
    <div class="prize-stars">🌟🎉🌟</div>
    <div class="prize-title">Amazing work!</div>
    <div class="prize-sub">You earned a video! Pick one to watch!</div>
    <div class="video-grid" id="video-grid"></div>
    <button class="keep-going" onclick="closePrize()">Keep going! ▶</button>
  </div>
</div>

    {title:"Roots, Prefixes and Suffixes Grade 4", url:"https://www.youtube.com/watch?v=yRwmr7CqnrY"},

const syllableTypes = [
  {
    id:"closed", label:"1. Closed", color:"#2E4057", light:"#E8EDF3",
    rule:"A closed syllable has a short vowel CLOSED in by a consonant. The vowel says its short sound.",
    grades: {
      "K-1": {
        ruleExample:["cat","sit","hop","bed","fun","map","bug","pen"],
        activity1Title:"Read these closed syllable words!",
        activity1Words:[
          {w:"cat",hint:"c-a-t"},{w:"sit",hint:"s-i-t"},{w:"hop",hint:"h-o-p"},
          {w:"bed",hint:"b-e-d"},{w:"fun",hint:"f-u-n"},{w:"map",hint:"m-a-p"},
          {w:"bug",hint:"b-u-g"},{w:"pen",hint:"p-e-n"},{w:"dig",hint:"d-i-g"},
          {w:"hot",hint:"h-o-t"},{w:"cup",hint:"c-u-p"},{w:"net",hint:"n-e-t"},

        blends:[
          {sounds:"c — a — t", word:"cat"},{sounds:"s — i — t", word:"sit"},
          {sounds:"h — o — p", word:"hop"},{sounds:"b — e — d", word:"bed"},
          {sounds:"f — u — n", word:"fun"},{sounds:"m — a — p", word:"map"},

      "2-3": {

        activity1Title:"Read these two-syllable closed words!",
        activity1Words:[
          {w:"rabbit",hint:"rab-bit"},{w:"mitten",hint:"mit-ten"},{w:"basket",hint:"bas-ket"},
          {w:"napkin",hint:"nap-kin"},{w:"plastic",hint:"plas-tic"},{w:"sunset",hint:"sun-set"},
          {w:"dentist",hint:"den-tist"},{w:"insect",hint:"in-sect"},{w:"mascot",hint:"mas-cot"},
          {w:"fantastic",hint:"fan-tas-tic"},{w:"traffic",hint:"traf-fic"},{w:"absent",hint:"ab-sent"},

        blends:[
          {sounds:"rab — bit", word:"rabbit"},{sounds:"mit — ten", word:"mitten"},
          {sounds:"bas — ket", word:"basket"},{sounds:"nap — kin", word:"napkin"},
          {sounds:"sun — set", word:"sunset"},{sounds:"den — tist", word:"dentist"},
        ]
      },
      "4-5": {
        ruleExample:["athletic","fantastic","establish","consistent","disconnect","represent"],
        activity1Title:"Read these multisyllabic closed words!",
        activity1Words:[
          {w:"athletic",hint:"ath-let-ic"},{w:"fantastic",hint:"fan-tas-tic"},{w:"establish",hint:"es-tab-lish"},
          {w:"consistent",hint:"con-sis-tent"},{w:"disconnect",hint:"dis-con-nect"},{w:"represent",hint:"rep-re-sent"},
          {w:"manuscript",hint:"man-u-script"},{w:"suspect",hint:"sus-pect"},{w:"conflict",hint:"con-flict"},
          {w:"construct",hint:"con-struct"},{w:"distinct",hint:"dis-tinct"},{w:"compact",hint:"com-pact"},
        ],
        blends:[
          {sounds:"ath — let — ic", word:"athletic"},{sounds:"fan — tas — tic", word:"fantastic"},
          {sounds:"es — tab — lish", word:"establish"},{sounds:"con — sis — tent", word:"consistent"},
          {sounds:"dis — con — nect", word:"disconnect"},{sounds:"rep — re — sent", word:"represent"},
        ]
      }
    }
  },
  {
    id:"open", label:"2. Open", color:"#185FA5", light:"#E6F1FB",
    rule:"An open syllable ends in a vowel with NOTHING after it. The vowel says its long sound (its name).",
    grades: {
      "K-1": {
        ruleExample:["go","me","hi","no","be","she","we","so"],
        activity1Title:"Read these open syllable words!",
        activity1Words:[
          {w:"go",hint:"g-o"},{w:"me",hint:"m-e"},{w:"hi",hint:"h-i"},
          {w:"no",hint:"n-o"},{w:"be",hint:"b-e"},{w:"she",hint:"sh-e"},
          {w:"we",hint:"w-e"},{w:"so",hint:"s-o"},{w:"he",hint:"h-e"},
          {w:"my",hint:"m-y"},{w:"by",hint:"b-y"},{w:"do",hint:"d-o"},

        ]
      },

        ruleExample:["robot","tiger","music","open","paper","hotel"],
        activity1Title:"Read these two-syllable open words!",

          {sounds:"mo — ti — vate", word:"motivate"},{sounds:"lo — ca — tion", word:"location"},
          {sounds:"mi — gra — tion", word:"migration"},{sounds:"cre — a — tion", word:"creation"},

      }
    }
  },
  {
    id:"silente", label:"3. Silent E", color:"#0F6E56", light:"#E1F5EE",

    grades: {
      "K-1": {
        ruleExample:["cake","bike","hope","cute","name","five","rose","mule"],
        activity1Title:"Read these magic E words!",
        activity1Words:[
          {w:"cake",hint:"c-a-ke"},{w:"bike",hint:"b-i-ke"},{w:"hope",hint:"h-o-pe"},
          {w:"cute",hint:"c-u-te"},{w:"name",hint:"n-a-me"},{w:"five",hint:"f-i-ve"},

        ],
        blends:[
          {sounds:"e — lab — o — rate", word:"elaborate"},{sounds:"con — trib — ute", word:"contribute"},

  {
    id:"vowelteam", label:"4. Vowel Team", color:"#854F0B", light:"#FAEEDA",

          {w:"play",hint:"ay team"},{w:"heat",hint:"ea team"},{w:"mail",hint:"ai team"},
          {w:"keep",hint:"ee team"},{w:"road",hint:"oa team"},{w:"tray",hint:"ay team"},

        blends:[
          {sounds:"r — ai — n", word:"rain"},{sounds:"f — ee — t", word:"feet"},

const grades = ["K-1","2-3","4-5"];
let currentSyllable = 0;
let currentGrade = "K-1";
let totalScore = 0;
let lastMilestone = 0;

function addScore(n) {
  totalScore += n;
  const pct = Math.min(100, Math.round((totalScore / 100) * 100));
  document.getElementById("prog").style.width = pct + "%";
  document.getElementById("score-label").textContent = totalScore + " ⭐";
  const toNext = 5 - (totalScore % 5);
  document.getElementById("prize-label").textContent = toNext === 5 ? "Keep it up! 🎁" : toNext + " more for a prize! 🎁";
  const milestone = Math.floor(totalScore / 5);
  if (milestone > lastMilestone) { lastMilestone = milestone; showPrize(); }
}

function showPrize() {
  const grid = document.getElementById("video-grid");
  const pool = videosByGrade[currentGrade] || videosByGrade["K-1"];
  const pick = [...pool].sort(() => Math.random() - 0.5).slice(0, 4);
  grid.innerHTML = pick.map(v => `<a class="video-link" href="${v.url}" target="_blank"><div class="video-icon">▶️</div>${v.title}</a>`).join("");
  document.getElementById("prize-modal").classList.add("show");
}

function closePrize() { document.getElementById("prize-modal").classList.remove("show"); }

function buildSyllableTabs() {
  const wrap = document.getElementById("syllable-tabs");
  wrap.innerHTML = "";
  syllableTypes.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.className = "syllable-tab" + (i === currentSyllable ? " active" : "");
    btn.textContent = s.label;
    btn.onclick = () => { currentSyllable = i; render(); };
    wrap.appendChild(btn);
  });
}

function buildGradeTabs() {
  const wrap = document.getElementById("grade-tabs");
  wrap.innerHTML = "";
  grades.forEach(g => {
    const btn = document.createElement("button");
    btn.className = "grade-tab" + (g === currentGrade ? " active" : "");
    btn.textContent = "Grades " + g;
    btn.onclick = () => { currentGrade = g; render(); };
    wrap.appendChild(btn);
  });
}

function markCard(id, correct) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove("correct","incorrect");
  el.classList.add(correct ? "correct" : "incorrect");
  if (correct) addScore(1);
}

function revealBlend(id) {
  const el = document.getElementById(id);
  if (el) el.classList.add("show");
}

function markBlend(cardId, revealId, correct) {
  const card = document.getElementById(cardId);
  if (!card) return;
  card.classList.remove("correct","incorrect");
  card.classList.add(correct ? "correct" : "incorrect");
  if (correct) addScore(1);
}

function render() {
  buildSyllableTabs();
  buildGradeTabs();
  const s = syllableTypes[currentSyllable];
  const g = s.grades[currentGrade];
  const content = document.getElementById("main-content");

  // Rule card
  let html = `<div class="rule-card" style="border-color:${s.color};background:${s.light};">
    <div class="rule-title" style="color:${s.color};">${s.label.replace(/^\d+\.\s*/,'')} Syllable</div>
    <div class="rule-body">${s.rule}</div>
    <div class="rule-examples">`;
  g.ruleExample.forEach(w => {
    html += `<div class="rule-example" style="background:${s.color};color:white;">${w}</div>`;
  });
  html += `</div></div>`;

  // Read words activity
  html += `<div class="activity-title">Read It!</div>`;
  html += `<div class="word-grid">`;
  g.activity1Words.forEach((item, i) => {
    const id = `wc_${s.id}_${currentGrade}_${i}`;
    html += `<div class="word-card" id="${id}">
      <div class="word-big">${item.w}</div>
      <div class="word-type">${item.hint}</div>
      <div class="card-btns">
        <button class="card-btn yes" onclick="markCard('${id}',true)">✅</button>
        <button class="card-btn no" onclick="markCard('${id}',false)">❌</button>
      </div>
    </div>`;
  });
  html += `</div>`;

  // Blend activity
  html += `<div class="activity-title">Blend It!</div>`;
  html += `<div class="blend-list">`;
  g.blends.forEach((item, i) => {
    const cardId = `bl_${s.id}_${currentGrade}_${i}`;
    const revId = `blr_${s.id}_${currentGrade}_${i}`;
    html += `<div class="blend-card" id="${cardId}">
      <div class="blend-prompt">Blend these syllables into a word:</div>
      <div class="blend-sounds">${item.sounds}</div>
      <div class="blend-answer" id="${revId}">The word is: <strong>${item.word}</strong> 🎉</div>
      <div class="blend-btns">
        <button class="blend-btn reveal" onclick="revealBlend('${revId}')">👀 Reveal</button>
        <button class="blend-btn yes" onclick="markBlend('${cardId}','${revId}',true)">✅ Got it!</button>
        <button class="blend-btn no" onclick="markBlend('${cardId}','${revId}',false)">❌ Try again</button>
      </div>
    </div>`;
  });
  html += `</div>`;

  content.innerHTML = html;
}

function resetAll() {
  totalScore = 0;
  lastMilestone = 0;
  currentSyllable = 0;
  currentGrade = "K-1";
  document.getElementById("prog").style.width = "0%";
  document.getElementById("score-label").textContent = "0 ⭐";
  document.getElementById("prize-label").textContent = "5 for a prize! 🎁";
  render();
}

render();
</script>
